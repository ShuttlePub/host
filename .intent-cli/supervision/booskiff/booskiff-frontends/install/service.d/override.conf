# Drop-in override for intent-cli.supervise.booskiff.booskiff-frontends.service
#
# 理由: 生成 unit の ExecStart は intent-cli を絶対パス / 埋め込み PATH で解決するが、
# systemd user 環境では direnv 由来の PATH が欠けて exit status 127 で crash-loop する
# 実測がある (emumet-main で 2026-08-31 確認、drift ledger 収録)。
# 本 override は ExecStart を `nix develop <host repo>` 経由に置き換え、
# host flake.lock が pin する intent-cli を常に使うようにする。
# 引数は生成 unit の ExecStart と完全に一致させ、プレフィックスだけ置き換えている。
#
# 適用:
#   mkdir -p ~/.config/systemd/user/intent-cli.supervise.booskiff.booskiff-frontends.service.d
#   cp .intent-cli/supervision/booskiff/booskiff-frontends/install/service.d/override.conf \
#      ~/.config/systemd/user/intent-cli.supervise.booskiff.booskiff-frontends.service.d/
#   systemctl --user daemon-reload
#   systemctl --user restart intent-cli.supervise.booskiff.booskiff-frontends.service
[Service]
ExecStart=
ExecStart=/run/current-system/sw/bin/nix develop /home/turtton/Documents/ShuttlePub/host --command intent-cli notify supervise --domain booskiff --team booskiff-frontends --repo ShuttlePub/shuttlepub-frontends --owner-role orchestration --bound 900 --interval 300 --bash-executable /nix/store/bwry105g7v5jspr41bx9x3fcfqsmfkq2-bash-interactive-5.3p15/bin/bash --routing-root /home/turtton/Documents/ShuttlePub/host --write --format json
