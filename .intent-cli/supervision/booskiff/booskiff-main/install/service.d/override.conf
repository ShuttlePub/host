# Drop-in override for intent-cli.supervise.booskiff.booskiff-main.service
#
# 理由: 生成 unit の ExecStart は nix store の intent-cli 0.27.1 絶対パスを直接指すため、
# intent-cli が更新されると store パスが stale になり exit 127/203 で crash-loop する。
# 本 override は ExecStart を `nix develop <host repo>` 経由に置き換え、
# host flake.lock が pin する intent-cli を常に使うようにする。
# (AENTS.md drift ledger: notify supervise install PATH hazard 対策の踏襲)
#
# 適用:
#   mkdir -p ~/.config/systemd/user/intent-cli.supervise.booskiff.booskiff-main.service.d
#   cp .intent-cli/supervision/booskiff/booskiff-main/install/service.d/override.conf \
#      ~/.config/systemd/user/intent-cli.supervise.booskiff.booskiff-main.service.d/
#   systemctl --user daemon-reload
#   systemctl --user restart intent-cli.supervise.booskiff.booskiff-main.service
[Service]
ExecStart=
ExecStart=/run/current-system/sw/bin/nix develop /home/turtton/Documents/ShuttlePub/host --command intent-cli notify supervise --domain booskiff --team booskiff-main --repo ShuttlePub/Booskiff --owner-role orchestration --bound 900 --interval 300 --bash-executable /nix/store/bwry105g7v5jspr41bx9x3fcfqsmfkq2-bash-interactive-5.3p15/bin/bash --routing-root /home/turtton/Documents/ShuttlePub/host --write --format json
