# Drop-in override for intent-cli.supervise.emumet.emumet-main.service
#
# 理由: 生成 unit の ExecStart は nix store の intent-cli 0.27.1 絶対パスを直接指すため、
# intent-cli が更新されると store パスが stale になり exit 127/203 で crash-loop する。
# 本 override は ExecStart を `nix develop <host repo>` 経由に置き換え、
# host flake.lock が pin する intent-cli を常に使うようにする。
# (AGENTS.md drift ledger: notify supervise install PATH hazard / ExecStart drift 対策の踏襲。
#  booskiff-main / booskiff-frontends で 2026-09-02 に検証済みの同形パターン)
#
# 適用:
#   mkdir -p ~/.config/systemd/user/intent-cli.supervise.emumet.emumet-main.service.d
#   cp .intent-cli/supervision/emumet/emumet-main/install/intent-cli.supervise.emumet.emumet-main.service \
#      ~/.config/systemd/user/
#   cp .intent-cli/supervision/emumet/emumet-main/install/service.d/override.conf \
#      ~/.config/systemd/user/intent-cli.supervise.emumet.emumet-main.service.d/
#   systemctl --user daemon-reload
#   systemctl --user restart intent-cli.supervise.emumet.emumet-main.service
[Service]
ExecStart=
ExecStart=/run/current-system/sw/bin/nix develop /home/turtton/Documents/ShuttlePub/host --command intent-cli notify supervise --domain emumet --team emumet-main --repo ShuttlePub/Emumet --owner-role orchestration --bound 900 --interval 300 --herdr-executable /nix/store/dqhw8fw0w00s88dq4dip9ica4p34251c-herdr-0.8.0/bin/herdr --bash-executable /nix/store/bwry105g7v5jspr41bx9x3fcfqsmfkq2-bash-interactive-5.3p15/bin/bash --routing-root /home/turtton/Documents/ShuttlePub/host --write --format json
