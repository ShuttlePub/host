# Drop-in override for intent-cli.supervise.emumet.emumet-main.service
#
# 理由: 生成 unit の ExecStart は `/usr/bin/env intent-cli` で、systemd user 環境の PATH には
# direnv 由来の intent-cli が含まれず exit status 127 で crash-loop する (2026-08-31 実測)。
# 本 override は ExecStart を `nix develop <host repo>` 経由に置き換え、
# host flake.lock が pin する intent-cli を常に使うようにする。
#
# 適用:
#   mkdir -p ~/.config/systemd/user/intent-cli.supervise.emumet.emumet-main.service.d
#   cp .intent-cli/supervision/emumet/emumet-main/install/service.d/override.conf \
#      ~/.config/systemd/user/intent-cli.supervise.emumet.emumet-main.service.d/
#   systemctl --user daemon-reload
#   systemctl --user restart intent-cli.supervise.emumet.emumet-main.service
[Service]
ExecStart=
ExecStart=/run/current-system/sw/bin/nix develop /home/turtton/Documents/ShuttlePub/host --command intent-cli notify supervise --domain emumet --team emumet-main --repo ShuttlePub/Emumet --owner-role orchestration --bound 900 --interval 300 --routing-root /home/turtton/Documents/ShuttlePub/host --write --format json
