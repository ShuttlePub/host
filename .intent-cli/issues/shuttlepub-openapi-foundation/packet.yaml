implementation_issue_packet:
  issue_title: "shuttlepub-openapi-foundation: ShuttlePub server 層への utoipa 導入と /api/v1 OpenAPI 契約基盤"
  issue_kind: feature
  source_execution_unit: shuttlepub-openapi-foundation
  domain: shuttlepub
  target_repo: ShuttlePub/ShuttlePub
  target_path: "server/, openapi/shuttlepub.json, Cargo.toml, Cargo.lock, .github/workflows/lint-and-test.yml"
  target_part: "ShuttlePub server 層(Axum)の OpenAPI(utoipa)生成基盤、/api/v1 共通 DTO・エラー形式、/openapi.json 配信、再生成差分 CI"
  dependencies: []
  technical_baseline:
    - "Axum server 層(ShuttlePub/ShuttlePub の server crate)へ utoipa 等を導入し、OpenAPI schema を生成する。生成 schema を契約の正本とする"
    - "WebAPI の定義だけを実装し、ハンドラーの本実装は行わない。契約 route の未実装部分は明示的な 501 を返す"
    - "frontends の SNS UI は本ユニットが生成する schema を取り込んで使う(producer の契約と consumer の接続は別ユニット)"
    - "旧 docs/openapi.json は廃止予定であり、互換・移行を考慮しない"
  intent_references:
    - "intents/shuttlepub/product/social-experience.md (I03)"
    - "intents/shuttlepub/packets/candidates.md (D03、共通の分割方針)"
    - "intents/shuttlepub/interviews/discord-feature-prioritization-2026-11-09.json (candidate-priority-q01〜q03)"
  acceptance_criteria:
    - "utoipa 由来の生成 schema が `openapi/shuttlepub.json` としてコミットされ、`GET /openapi.json` の配信内容と一致する"
    - "契約 route の未実装部分は共通エラー形式の明示的 501 を返し、架空の成功応答や todo!/unimplemented! を使わない"
    - "schema は決定的に再生成され(同一入力で byte 一致)、コミット済み schema との差分を CI が検出して失敗する"
    - "/api/v1 用の DTO と共通エラー形式が定義され、schema に components として出力される"
    - "既存 dev API(/api/notes 等)の挙動と既存テストを壊さない。既存 Rust CI(fmt / clippy -D warnings / test / build / git diff --check)がグリーン"

