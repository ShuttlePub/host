    diagram:
      required: false
      target_paths: []
      diagram_type: none
    docs:
      required: false
      target_paths: []
      summary: ""
  closeout_learning:
    expected: "Stage 8 の確定値: facade newtype の一覧と各公開メソッド、配線専用1型の名前と構造 (AppModule/Handler 統合の結果)、impl_database_delegation! の拡張内容、*Query trait の最終配置 (kernel 内パス)、Param 型の移動先、transfer→dto / Signal 削除の実施記録"
    write_back_required: true
    write_back_targets:
      - intents/emumet/decisions/0006-architecture-realignment-transaction-projection.md
