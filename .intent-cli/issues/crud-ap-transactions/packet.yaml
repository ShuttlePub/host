implementation_issue_packet:
  issue_title: "crud-ap-transactions: Block / Inbox Follow / Inbox Block を tx + 配送 outbox 化、Mute / Accept / Undo 系を冪等 repo 操作化 (ADR 0006 Stage 5)"
  issue_kind: feature
  source_execution_unit: crud-ap-transactions
  domain: emumet
  target_repo: ShuttlePub/Emumet
  target_path: "application/src/service/block.rs, application/src/service/mute.rs, application/src/service/activitypub/outbound_block.rs, application/src/service/activitypub/outbound_follow.rs, application/src/service/activitypub/outbound_unfollow.rs, application/src/service/activitypub/inbox/handlers.rs, application/src/service/activitypub/inbox/mod.rs, application/src/service/activitypub/outbox.rs, application/src/service/activitypub/delivery.rs, kernel/src/database.rs, kernel/src/repository/block.rs, kernel/src/repository/follow.rs, kernel/src/repository/mute.rs, kernel/src/repository/outbox_activity.rs, driver/src/database/postgres/block.rs, driver/src/database/postgres/follow.rs, driver/src/database/postgres/mute.rs, driver/src/database/postgres/outbox_activity.rs, server/src/route/account/block_mute.rs, server/src/route/account/follow.rs, server/src/route/activitypub/inbox.rs"
  target_part: "Block / Inbox Follow / Inbox Block の UoW 化 + AP 配送 outbox 化、Mute / Accept / Undo Follow / Undo Block の冪等 repo 操作化"
  dependencies:
    - architecture-foundation
  technical_baseline:
    - "BlockAccountUseCase / UnblockAccountUseCase (`application/src/service/block.rs`) は auto-commit 接続を取得し、Block 作成/削除、双方向 follow 解除/復元、remote 宛 Block/Undo(Block) の配送、outbox 記録を順次実行。delivery は DB write より先に行われ、失敗時に local state が不整合になりうる"
    - "MuteAccountUseCase / UnmuteAccountUseCase (`application/src/service/mute.rs`) は auto-commit 接続で mutes テーブルへの insert/delete を行う。重複時はアプリ層で `Rejected` を返している (DB の partial unique index あり)"
    - "Inbox Follow ハンドラ (`application/src/service/activitypub/inbox/handlers.rs:handle_follow_activity`) は remote_account upsert、follow 作成 (approved)、Accept アクティビティの配送、outbox 記録を auto-commit で実行"
    - "Inbox Block / Undo(Block) ハンドラ (`application/src/service/activitypub/inbox/handlers.rs`) は remote_account upsert、block 作成/削除、双方向 follow 解除を auto-commit で実行"
    - "Inbox Accept ハンドラ (`application/src/service/activitypub/inbox/handlers.rs:handle_accept_activity`) は auto-commit で既存 follow の approved_at 更新を行う"
    - "SendFollowUseCase / SendUndoFollowUseCase (`application/src/service/activitypub/outbound_follow.rs`, `outbound_unfollow.rs`) も auto-commit で follow 作成/削除と delivery + outbox 記録を混在させている。本 Stage では outbound Follow/Undo(Follow) も含むか否かは In Scope / Out Of Scope を参照"
    - "outbox_activities テーブルは `migrations/20260621000004_add_outbox_activities.sql` で定義済み。現状は outbox collection API 用の記録兼 delivery 後の履歴。delivery 専用 queue / worker は未整備"
    - "`TransactionManager` port (`kernel/src/database.rs`) と `PostgresTransactionManager` は Stage 1 で導入済み。Stage 4 で CreateAccount / UpdateAccountDetail / moderation で本採用済み"
    - "`BlockRepository` / `FollowRepository` / `MuteRepository` / `OutboxActivityRepository` は kernel port + Postgres 実装。insert は unique 制約違反を `Rejected` で返すが、idempotent な `insert_if_absent` / `delete_if_exists` 等のインターフェースはない"
  intent_references:
    - intents/emumet/decisions/0006-architecture-realignment-transaction-projection.md
    - intents/emumet/packets/backlog.md
  acceptance_criteria:
    - "BlockAccountUseCase / UnblockAccountUseCase を `TransactionManager::transaction()` ベースの UoW に移行。DB 書き込み (block 作成/削除、follow 解除/復元、outbox 記録) を同一トランザクションにまとめ、AP delivery HTTP は commit 成功後に実行される"
    - "Inbox Follow / Inbox Block / Undo(Block) ハンドラを UoW 化。remote_account upsert、follow/block 作成・削除、follow 解除、Accept/outbox 記録を tx 内にまとめ、delivery は commit 後"
    - "Mute / Accept / Undo Follow / Undo Block を冪等 repository 操作に置換。重複・不存在・未承認を DB 制約 + 戻り値で解釈し、アプリ層での事前 `find` + `Rejected` 依存を減らす (`insert_if_absent`、`approve_follow_if_pending`、`delete_follow_if_exists`、`delete_block_if_exists`、`delete_mute_if_exists` 等)"
    - "冪等 repo 操作は UoW を必要としない。必要なら `&mut Connection` executor を引き渡し、単一 auto-commit 接続で実行する"
    - "AP 配送 outbox 化: delivery 失敗時に再試行できる構造を導入。最小構成は outbox テーブルへの `delivered_at`/`attempted_at`/`error` 列追加、または `ap_delivery_queue` テーブル新設 + post-commit 即時 delivery。worker 化は optional とし、acceptance criteria で post-commit delivery と失敗時の再試行可能性を要求"
    - "outbox 記録と AP 配送は projection 通知 outbox (ADR 決定4) と別物であることを明示。`outbox_activities` は AP collection 用テーブルであり、必要に応じて delivery state 列を追加する"
    - "配線層 (`server/src/handler.rs`, `server/src/route/**`) で `DependOnTransactionManager` を AppModule 経由で受け取れるようにする。route facade newtype 化は Stage 8 のスコープ"
    - "`cargo test` (DATABASE_URL あり) / clippy / fmt green。e2e (compose) green"
    - "Block/Mute/Follow 系の既存振る舞い (Block 時の双方向 follow 解除、重複 Block/Mute/Follow の拒否、リモート Mute 非連合) は維持する"
  intent_placement:
    primary_intent: intents/emumet/decisions/0006-architecture-realignment-transaction-projection.md
    supporting_intents: []
    new_intent_needed: false
    placement_rationale: "ADR 0006 Stage 5 の実施ユニット。Stage 5 の確定値 (UoW 化対象・冪等 repo 操作対象・delivery outbox パターン) を ADR 決定2/3/4 に writeback"
  knowledge_updates:
    intent_tree:
      required: false
      target_paths: []
      summary: ""
    adr:
      required: true
      target_paths:
        - intents/emumet/decisions/0006-architecture-realignment-transaction-projection.md
      decision_title: "Stage 5 の UoW 対象・冪等 repo 操作対象・AP 配送 outbox パターンを決定2/3/4 に追記"
    diagram:
      required: false
      target_paths: []
      diagram_type: none
    docs:
      required: false
      target_paths: []
      summary: ""
  closeout_learning:
    expected: "Stage 5 の確定値: Block/Inbox Follow/Inbox Block の UoW 化可否、delivery outbox の実装パターン (post-commit immediate / worker)、冪等 repo 操作の signature、Accept/Undo 系の idempotency ルール"
    write_back_required: true
    write_back_targets:
      - intents/emumet/decisions/0006-architecture-realignment-transaction-projection.md
  guide_reachability:
    no_role_facing_surface: true
    routes: []

