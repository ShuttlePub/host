      target_paths: []
      summary: ""
  closeout_learning:
    expected: "Stage 7 の確定値: DependOnProfileRepository / DependOnMetadataRepository の形状、ProfileProjector / MetadataProjector の確定配置と checkpoint 名、削除済み Metadata の load セマンティクス、Profile LWW 維持の是非、ProfileDto / MetadataDto の形状、同期書込み維持範囲"
    write_back_required: true
    write_back_targets:
      - intents/emumet/decisions/0006-architecture-realignment-transaction-projection.md
  guide_reachability:
    no_role_facing_surface: true
    routes: []

