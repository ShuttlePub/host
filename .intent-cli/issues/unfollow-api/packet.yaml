implementation_issue_packet:
  issue_title: "外向き unfollow REST API(Undo(Follow) 配送) + REST followers/following 一覧"
  issue_kind: feature
  source_execution_unit: unfollow-api
  domain: emumet
  target_repo: ShuttlePub/Emumet
  target_path: application/src/service/activitypub/, application/src/transfer/, server/src/route/account/, server/src/schema/account.rs, server/src/openapi.rs, server/tests/e2e_ap_mock.rs, openapi.json
  target_part: "外向き Undo(Follow) 配送ユースケース + unfollow REST ハンドラ + REST followers/following 一覧ハンドラ"
  dependencies: []
  technical_baseline:
    - "Follow は純 CRUD エンティティ(イベントソーシング非対象)。approved_at: Option<FollowApprovedAt> で承認状態を表現"
    - "署名付き配送は application/src/service/activitypub/delivery.rs の deliver_activity_to_inbox が唯一の窓口"
    - "REST ルート追加は route/account/mod.rs AccountRouter + openapi.rs 登録 + openapi.json 再生成の3点セット"
    - "認証は auth_middleware(Ory Hydra JWT)、権限はユースケース内 check_permission(account_sign)"
  intent_references:
    - "intents/emumet/features/ap-federation/overview.md"
    - "intents/emumet/packets/backlog.md"
  acceptance_criteria:
    - "POST /api/v1/accounts/{account_id}/unfollow が存在し、認証なしで 401、他人のアカウントで 403 を返す"
    - "リモート相手へのフォロー解除で署名付き Undo(Follow) が相手 inbox に配送されることを mock peer E2E で確認できる"
    - "Undo 配送成功後にローカル follow 行が削除され、配送失敗時は follow 行が残りエラーが返る"
    - "GET /api/v1/accounts/{account_id}/followers と .../following が承認済みフォローのみ返す(pending 不含)"
    - "openapi.json が再生成され openapi_spec_matches_committed_file テストが通る"

