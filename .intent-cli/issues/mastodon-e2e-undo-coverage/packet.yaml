  issue_title: "Mastodon 実機 E2E に Undo(Follow) 相互運用シナリオ (S10) を追加"
  issue_kind: feature
  source_execution_unit: mastodon-e2e-undo-coverage
  domain: emumet
  target_repo: ShuttlePub/Emumet
  target_path: server/tests/e2e_ap_mastodon.rs, server/tests/support/mastodon.rs, server/tests/support/mastodon_setup.rs, README.md
  target_part: "Mastodon E2E の S10 ステップ (Undo(Follow) 相互運用) + Mastodon クライアント/ポーリング ヘルパー追加"
  dependencies: []
  technical_baseline:
    - "外向き Undo(Follow) REST (POST /api/v1/accounts/{account_id}/unfollow, 204/400/403/404/422) は unfollow-api (PR #21) で実装済み"
    - "inbox の Undo(Follow) 受信処理 (handle_undo_follow) も実装済み・冪等 (characterization_tests.rs inbox_undo_follow_is_idempotent)"
    - "Mastodon E2E は server/tests/e2e_ap_mastodon.rs の単一テスト mastodon_full_federation_scenario が S7-S9 を結合実行する形式"
    - "mock peer 向け Undo(Follow) E2E (e2e_ap_mock.rs outbound_unfollow_sends_undo_to_remote_inbox) が検証項目のテンプレート"
    - "Iceshrimp S10 (e2e_ap_iceshrimp.rs, Block/Undo(Block)) が実サーバー Undo 相互運用の直近先例"
  intent_references:
    - "intents/emumet/features/ap-federation/overview.md"
    - "intents/emumet/packets/backlog.md"
    - "intents/emumet/clarifications/open.md"
  acceptance_criteria:
    - "mastodon_full_federation_scenario に S10 (Undo(Follow)) ステップが追加され、bash e2e/run-ap-e2e.sh (CI e2e.yml 相当) がグリーン"
    - "Emumet→Mastodon 方向: post_unfollow が 204 を返し、Mastodon 側 followers 一覧から Emumet actor が消失し、Emumet 側 following コレクションの totalItems が 0 に戻る"
    - "Mastodon→Emumet 方向: Mastodon REST の unfollow により Emumet inbox が Undo(Follow) を処理し、Emumet 側 followers コレクションの totalItems が 0 に戻る"
    - "MastodonClient に unfollow_account メソッド、mastodon_setup に wait_for_mastodon_followers_absent (および必要なら following_absent) ヘルパーが追加されている"
    - "README.md のシナリオ一覧に Mastodon 向け S10 (Undo(Follow)) の行が追加されている"

