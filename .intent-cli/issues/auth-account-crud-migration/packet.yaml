      decision_title: "Stage 6 確定値 (AuthAccount CRUD port signature・find-or-create 原子化・同期 projection 例外除去・データ移行手順) を決定8/9/10 に追記"
    diagram:
      required: false
      target_paths: []
      diagram_type: none
    docs:
      required: false
      target_paths: []
      summary: ""
  closeout_learning:
    expected: "Stage 6 の確定値: AuthAccountRepository port signature、find_or_create の SQL 形状 (ON CONFLICT DO NOTHING + RETURNING の可否とフォールバック SELECT)、auth_accounts.version 列の扱い、auth_account_events バックフィル・drop 手順、Redis リペア経路除去の影響範囲"
    write_back_required: true
    write_back_targets:
      - intents/emumet/decisions/0006-architecture-realignment-transaction-projection.md
  guide_reachability:
    no_role_facing_surface: true
    routes: []

