implementation_issue_packet:
  issue_title: "OAuth2 明示同意画面 (BFF standalone HTML ページ + i18n スコープラベル)"
  issue_kind: feature
  source_execution_unit: oauth2-consent-flow
  domain: ratcap
  target_repo: ShuttlePub/RatCap
  target_path: index.ts, bff/server.test.ts, デプロイ設定 (Hydra consent URL)
  target_part: "BFF の /auth/* と同じ層に追加する consent GET/POST ハンドラ"
  dependencies: []
  technical_baseline:
    - "Emumet GET/POST /oauth2/consent は実装済み (challenge ベース非認証、ShowConsent JSON / skip 時 302)"
    - "D8: BFF (index.ts) の素 HTML standalone ページ。Flame SSR / PureScript 側は変更しない"
    - "D9: スコープ表示は日本語プライマリの i18n ラベルマップ。言語は Accept-Language からサーバーサイド判定、未知スコープは生名フォールバック"
    - "D10: ratcap_session を要求しない。challenge 欠落・不正時はエラーページ"
    - "D5: mock 認証モードでは無効・スキップ"
    - "D6: Hydra consent URL を Ratcap /oauth2/consent に向ける設定変更を成果物に含める"
  intent_references:
    - intents/ratcap/features/oauth2-consent/decisions.md
    - intents/ratcap/features/oauth2-consent/requirements.md
    - intents/ratcap/features/oauth2-consent/acceptance.md
    - intents/ratcap/interview/2026-08-24-oauth2-consent-flow-grill.md
  acceptance_criteria:
    - "GET /oauth2/consent?consent_challenge=... で ShowConsent 応答時に HTML 同意ページが表示される (auto-skip 時は 302 伝搬)"
    - "client_name とスコープ一覧がラベル表示され、未知スコープは生名フォールバックする"
    - "Accept-Language: ja で日本語、en で英語ラベルが返る"
    - "同意ページの取得・送信が ratcap_session cookie なしで完結する"
    - "許可で accept: true + grant_scope、拒否で accept: false (grant_scope なし) が送信され 302 Location へ遷移する"
    - "challenge 欠落・不正時にエラーページが表示される"
    - "bun test 全件成功 (既存 /auth/* フローにリグレッションなし)"
    - "real モードで Hydra consent skip 無効化の手動 E2E が完結する"

