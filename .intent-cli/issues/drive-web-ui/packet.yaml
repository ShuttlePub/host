implementation_issue_packet:
  issue_title: "drive-web-ui: 最小 Web UI (PureScript + Flame SSR/hydration + Bun BFF) — shuttlepub-frontends apps/booskiff-web"
  issue_kind: feature
  source_execution_unit: drive-web-ui
  domain: booskiff
  target_repo: ShuttlePub/shuttlepub-frontends
  target_path: apps/booskiff-web
  target_part: "Booskiff drive の最小 Web UI (Flame SSR + hydration) と Bun BFF"
  dependencies: [drive-foundation]
  technical_baseline:
    - "PureScript + Flame (SSR + hydration) — D11 (Q16 反転後)"
    - "Bun BFF: OAuth/OIDC (Kratos/Hydra 連携、Ratcap bff/ パターン転用)、HTTP-only Cookie セッション、トークン更新、セッション→JWT 変換"
    - "core (ShuttlePub/Booskiff) は REST/OpenAPI (D10)、JWT Bearer (機械 API)、ブラウザは JWT を一切見ない"
    - "アップロード = BFF 経由ストリーミング (core へ中継)、ダウンロード = core 発行の短命 presigned URL へリダイレクト (D5)"
  intent_references:
    - "intents/booskiff/intent-tree/00-map.md"
    - "intents/booskiff/decisions/2026-08-29-initial-shaping.md (D11/D14/D15)"
    - "intents/booskiff/technology/overview.md"
  acceptance_criteria:
    - "SSR された Drive 画面 (ファイル/フォルダ一覧) が hydration され、ログイン・一覧・詳細表示がブラウザのみで完結する"
    - "BFF 経由の OAuth/OIDC ログインが HTTP-only Cookie セッションで完結し、ブラウザの storage に JWT が残らない"
    - "アップロードが BFF → core へストリーミング中継され、100 MB/file 上限・進捗表示・クォータ更新が動く"
    - "ダウンロードが presigned URL へのリダイレクトで完結し、削除・フラットフォルダ CRUD が動く"
    - "Playwright Web E2E (D15) が core + MinIO + Postgres + web の compose 上でグリーン"
  revision_history:
    - "2026-08-30: 初版ドラフト。Q16 反転後の Web slice として切出し (drive-foundation から分離)。"
    - "2026-08-30: publish-flow が issue_title を読まず title-fallback (untitled) で
      ShuttlePub/shuttlepub-frontends#8 を作成したため、gh issue edit でタイトルを手修正
      (CLI drift: drive-foundation#1 では同じ packet.yaml 構造でタイトル解決が成功した)。
      intent-target 適用前の pre-boundary 修正。"

