implementation_issue_packet:
  issue_title: "profile-actor-identity-foundation: Profile username の実保存・一回限り設定と Profile actor 情報・鍵・WebFinger/actor 文書生成の基盤"
  issue_kind: feature
  source_execution_unit: profile-actor-identity-foundation
  domain: emumet
  target_repo: ShuttlePub/Emumet
  target_path: "kernel/src/entity/profile/ (username 型・actor 情報・鍵), kernel/src/repository/, driver/src/database/postgres/ (profile repository・Profile 鍵 repository), application/src/service/profile.rs と account 作成 use case, server/src/route/account/mod.rs (username 保存への切替), server/src/route/activitypub/ (生成ロジックのみ・本番未 mount), migrations/ (P1 の非破壊の追加 migration は通常の migrations/ に置き本番適用してよい。破壊的 migration と P2 テーブルの本番採番は P4), openapi.json"
  target_part: "Profile 単位 identity の基盤: username の実保存・一回限り設定、Profile actor 情報・鍵の型と repository、WebFinger／actor 文書の生成 (本番未公開)"
  dependencies:
    - "profile-domain-policy-api-contract"
  technical_baseline:
    - "durable state、packet、intent、queue の正本は ShuttlePub/host のみ。Emumet 側の旧 design-host 記述を根拠に child へ親状態を作成しない。"
    - "E8 確定契約 (Emumet#66 / PR #70、マージ前): /api/v1/profiles/{profile_nanoid} 系に follows (POST、DELETE /{follow_id})、following/followers (GET)、blocks/mutes (GET/POST、DELETE /{id})、domain-controls (GET 一覧、GET/PUT/DELETE /{domain}) を OpenAPI タグ ProfilePolicy の 501 スタブとして定義済み。全て現在の所有者のみ、エラーは 401/403/404/409/422/501。domain-controls の revision は 1 始まりで変更ごとに増加、PUT は expected_revision 省略で新規作成 (既存なら 409)・指定時は一致する場合のみ置換、DELETE は expected_revision 必須 (不一致 409)。将来 actor は GET /ap/profiles/{profile_nanoid} (URL 最終形は P1 で確定)。POST /api/v1/accounts の profile_username と POST /api/v1/profiles の username は optional で、形式不正は 400、有効値は副作用前に 501、ProfileResponse.username は nullable。schema は server/src/schema/profile_policy.rs と profile_username.rs"
    - "P1〜P3 の新機構は本番 root router に mount せず、新配送 worker も root で起動しない。P4 (profile-federation-in-place-cutover) が一括で mount・旧 route 撤去・worker 起動と、破壊的 migration・P2 の新関係/配送テーブルの本番採番を所有する。P1 の非破壊の追加 migration (username 列・Profile 鍵テーブル・index 等) は通常の migrations/ に置き本番適用してよい (親判断 2026-11-10。旧連合データの初期化など破壊的な変更は P1 で行わない)"
    - "共有ファイル (server/src/openapi.rs, route.rs, main.rs, DI wiring, migrations/, openapi.json) は他レーンと競合する。共有ファイルの統合は一件ずつ行い、その時点の main から OpenAPI を再生成する (openapi_spec_matches_committed_file を通す)"
    - "検証は DATABASE_URL を設定した実 DB テストで行う。DB テストを skip のみで通過させない (test_with::env による skip は検証として数えない)"
    - "username 仕様 (E8 で確定): 形式 ^[a-z0-9][a-z0-9._-]{0,63}$ (ASCII 小文字 1〜64 文字)、暗黙の trim・小文字化なし。予約語 admin, administrator, root, system, support, security, moderator, api, ap, auth, oauth, oauth2, login, logout, register, settings, well-known。DB 一意・削除済み再利用なし・Account 名から自動導出しない。段階: E8/P1〜P3 optional → FN で UI 必須送信 → P4 で required"
    - "D08 ユーザー決定 (grill d08-q01〜q15): Profile 単位、完全一致 domain のみ、mute は表示抑制のみ、block は双方向 Follow 解除＋新規操作拒否 (解除しても関係復元なし)、AP Block は送らない、旧連合 identity は引き継がず新 Profile actor から開始 (旧連合データのみ初期化、DB 全消去ではない)、username は Profile ごとに一意・一度決めたら不変・移管後も維持"
    - "現状: Account 単位 actor が前提。署名鍵 signing_keys は account_id 紐付け、AP route は /ap/accounts/... と /.well-known/webfinger (server/src/route/activitypub/)、署名 API は /internal/v1/accounts/{id}/sign と .../public-key。Profile は username を持たない。ADR 0002 は 1 Profile = 1 actor を採用済みだが実装は未追従"
    - "新設 ADR intents/emumet/decisions/profile-actor-identity.md は ADR 0002 (AP actor は Profile 単位) の実装確定、ADR 0007 (Profile 移管は Account 変換ではなく Profile 単位) と整合する identity 所有主体の規則を記録する。host 側の ADR は親が新設済みで、本 unit は実装で確定した細部 (actor URL 最終形、鍵保存形式、一回限り設定の競合規則) を closeout で write-back する"
    - "一回限り設定: 所有者が username 未設定の Profile に一度だけ設定できる。設定後は変更不可。username を通常の編集機能 (PATCH 等) として公開しない"
  intent_references:
    - "intents/emumet/features/personal-domain-controls/overview.md"
    - "intents/emumet/features/personal-domain-controls/packets.md"
    - "intents/emumet/features/personal-domain-controls/acceptance.md"
    - "intents/emumet/features/profile-federation/overview.md"
    - "intents/emumet/features/profile-federation/packets.md"
    - "intents/emumet/features/profile-federation/acceptance.md"
    - "intents/shuttlepub/packets/candidates.md (D08 節)"
    - "intents/shuttlepub/product/social-experience.md (I08)"
    - "intents/shuttlepub/interviews/discord-feature-grill-2026-10-15.json (d08-q13〜q15)"
    - "intents/emumet/decisions/0002-account-address-on-emumet-domain.md"
    - "intents/emumet/decisions/0003-delegated-signing.md"
    - "intents/emumet/decisions/0007-organization-accounts.md"
    - "intents/emumet/features/ap-federation/overview.md"
    - ".intent-cli/issues/profile-domain-policy-api-contract/ (E8 packet)"
  acceptance_criteria:
    - "旧作成 payload (username 省略) は従来どおり受理される。新 payload の username は保存され、Account と Profile の同時作成 (profile_username) でも同時設定できる"
    - "重複 username・予約語・形式違反は拒否され、一意性は DB 制約で保証される (競合する同時設定でも片方のみ成功)。削除済み Profile の username は再利用できない"
    - "所有者は未設定 Profile に username を一度だけ設定でき、設定済み Profile への再設定は拒否される。所有者以外は設定できない"
    - "Profile 移管で username・将来 actor URI・鍵の所有主体が変わらない"
    - "Profile username の保存がイベント再適用で復元される (イベント履歴から projection を再構築しても同じ username になる)"
    - "Profile 鍵による署名が検証でき、WebFinger／actor 文書の生成結果が Profile 単位の acct・actor URI・公開鍵を指す"
    - "実 root 構成で本番 /ap/profiles/... が mount されておらず、新配送 worker が root で起動しないことを route 不在テストで確認する"
    - "username 設定を除き、新 actor・Profile 鍵の本番生成を開始しない"
    - "openapi.json を再生成し openapi_spec_matches_committed_file が通る (E8 の 501 記述が保存に変わった差分のみ)。既存 Rust CI が通る"
  revision_history:
    - "2026-11-10: 公開後の是正 (親判断)。P1 の非破壊の追加 migration (username 列・Profile 鍵テーブル・index) は通常の migrations/ に置き本番適用してよい。『P1 は検証用 migration のみで本番採番は P4』とした target_path と technical_baseline の記述を是正した。P4 が所有するのは旧連合データ初期化などの破壊的 migration と P2 の新関係/配送テーブルの本番採番。Emumet#71 の本文も gh issue edit で同期 (AGENTS.md ledger『packet revision after publish』の手順)。"
    - '2026-11-10: Emumet#71 の issue 本文への同期は保留 (gh issue edit の許可待ち。ユーザー確認 question-a400e8a5dd88cfb79865cbb5282d7dbe)。許可後に github-body.md の内容で本文を置換する。それまで公開済み issue 本文は旧記述 (本番採番は P4) のまま'

