implementation_issue_packet:
  issue_title: "profile-identity-read-exposure: AccountResponse に Profile の nanoid (profile_id) と username (profile_username) を追加"
  issue_kind: feature
  source_execution_unit: profile-identity-read-exposure
  domain: emumet
  target_repo: ShuttlePub/Emumet
  target_path: "application/src/dto/account.rs, application/src/service/account_detail/read.rs, application/src/service/account_detail/update.rs, server/src/schema/account.rs, server/src/route/account/client_tests.rs (実 DB route test), openapi.json"
  target_part: "Account 取得・一覧・作成・更新の応答 (AccountResponse) に、その Account に属する Profile の識別子 profile_id (Profile nanoid) と profile_username (未設定は null) を追加する読取専用の追加"
  dependencies: []
  technical_baseline:
    - "durable state、packet、intent、queue の正本は ShuttlePub/host のみ。Emumet 側の旧 design-host 記述を根拠に child へ親状態を作成しない。"
    - "計画外の追加 unit (ユーザー承認 question-da4ae5d616cf6197f307bfffdc86868a)。FN (shuttlepub-frontends#34) が既存 Profile への一回限り username 設定 (POST /api/v1/profiles/{profile_nanoid}/username、P1 マージ済み) や Profile 単位 API 呼出しで対象 Profile を特定するために、ログイン中の個人 Account の Profile 識別子をクライアントが取得できる必要がある。現状の AccountResponse は Profile の nanoid・username を持たない"
    - "AccountResponse を返す経路は server/src/route/account/client.rs の GET /api/v1/accounts (ids 指定と cursor 一覧)、GET /api/v1/accounts/{account_id}、POST /api/v1/accounts (作成後に get_account_detail で再取得)、PATCH /api/v1/accounts/{account_id}。すべて application の AccountDetailDto (read.rs の compose_account_details と update.rs の update_account_detail_authorized が構築) から schema/account.rs の account_dto_to_response で変換される。DTO に追加すれば全経路に反映される"
    - "認可・可視性は既存の Account 取得と同一のまま変えない (check_permission の account_view、find_by_nanoid の無効化 Account 除外、停止中・BAN 中は moderation 付きで返す、更新系は active のみ)。他人の Account では Profile 情報を含め何も返さない。新しい endpoint・permission は作らない"
    - "Profile と Account の関係: profiles.account_id は現在の所有 Account。個人 Account は個人 Profile を 1 件 (partial unique index profiles_personal_account_unique)、組織 Account は 0 件以上の Profile を持ちうる (組織 Profile 作成・移管受入れ)。Profile 移管 (profile_transfer respond) は Profile の account_id を移管先の組織 Account へ付け替えるため、profile_id・profile_username は移管後は移管先 Account の応答側に現れる。移管元の個人 Account の Profile 欠落時の現行挙動 (Profile not found で NotFound) は本 unit では変更しない"
    - "組織 Account が複数 Profile を持つ場合、現行は profile_map の HashMap 構築順 (最後の行) で表示 Profile が決まり不定。表示項目 (display_name 等) と profile_id を同一 Profile から返し、選択を決定的にする (account あたり最小 profile id)。read.rs と update.rs (find_by_account_id) で同じ選択規則を使い、GET と PATCH の応答が食い違わない。これ以上の組織 Profile 一覧は Profile 一覧 API (対象外) の担当"
    - "ProfileProjection は nanoid() と username() を持つ (P1)。username の値は一回限り設定後不変。追加フィールド名は profile_id / profile_username (POST /api/v1/accounts の request の profile_username と対称)。username 未設定は null。既存フィールドは削除・改名・型変更しない (追加のみ)"
    - "OpenAPI は route + openapi.rs 登録 + openapi.json 再生成の3点セット。openapi_spec_matches_committed_file テストが生成物とコミット済み openapi.json の一致を検証する。AccountResponse の schema 説明文に追加フィールドの意味 (個人 Account は個人 Profile、組織 Account は代表 Profile、username 未設定は null) を記載する"
    - "P4 (PR #91、未マージ) は Account 関連ファイルも触るため、変更は最小限 (DTO・compose・update の DTO 構築・response 変換・OpenAPI・テスト) に留め、無関係なリファクタを含めない。FN と P4 の前にマージする"
  intent_references:
    - "intents/emumet/features/profile-federation/overview.md"
    - "intents/emumet/features/profile-federation/packets.md"
    - "intents/emumet/features/profile-federation/acceptance.md"
    - "intents/emumet/decisions/profile-actor-identity.md"
    - "intents/emumet/decisions/0002-account-address-on-emumet-domain.md"
    - "intents/emumet/decisions/0007-organization-accounts.md"
    - "intents/shuttlepub/packets/candidates.md (D08 節)"
  acceptance_criteria:
    - "AccountResponse を返す全経路 (GET /api/v1/accounts の ids 指定・一覧、GET /api/v1/accounts/{account_id}、POST /api/v1/accounts、PATCH /api/v1/accounts/{account_id}) に profile_id (Profile nanoid、文字列) と profile_username (文字列または null) が含まれる"
    - "後方互換: 既存フィールドの名前・型・値・存在条件・HTTP ステータスは変更されない (追加のみ)。既存の contract test・OpenAPI 検証が追加フィールド以外の差分なしで通る"
    - "個人 Account で、profile_id がその個人 Profile の nanoid と一致し、profile_username が保存済みの username (作成時 profile_username 指定、または一回限り設定後) と一致する。username 未設定の Profile (legacy・username 省略で作成) では null になる。実 DB の route test で作成直後・取得・一覧・ids 指定・更新後の各応答を検証する"
    - "認可は既存の Account 取得と同じ: 他人の Account は返さず (ids 指定では結果に含めず、個別取得は既存と同じ NotFound)、その Profile の nanoid・username も露出しない。実 DB で他人の Account の Profile 識別子が応答のどこにも含まれないことを検証する"
    - "無効化・停止中の扱いが既存の Account 取得と一致する: 無効化 (deactivated) Account は既存どおり返らない、停止 (suspended)・BAN 中は既存どおり moderation 付きで返り、Profile 識別子も返る (既存の可視性規則を変えない)。実 DB で各状態の応答を既存挙動と比較して検証する"
    - "Profile 移管後の値の正しさ: 個人 Profile を組織 Account へ移管した後、profile_id・profile_username は移管先の所有関係に従って移管先の組織 Account の応答に現れ、移管元の個人 Account の応答には現れない (移管元の Profile 欠落時の既存挙動は変更しない)。移管は実際の移管 use case または同等の実 DB 状態で再現して検証する"
    - "組織 Account の扱いが PR に明記され、複数 Profile を持つ組織 Account でも表示 Profile と profile_id が同一 Profile で決定的 (account あたり最小 profile id)、GET と PATCH で一致する。実 DB で検証する"
    - "新しい endpoint・permission・username 更新手段・Profile 一覧 API を追加しない。openapi.json を再生成し、openapi_spec_matches_committed_file と CI の openapi-check (git diff --exit-code openapi.json) が通る。DATABASE_URL を設定した実 DB テストで skip のみに頼らず実行・パスし、既存 Rust CI (fmt / clippy / test) が通る"
