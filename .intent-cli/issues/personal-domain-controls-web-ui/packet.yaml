implementation_issue_packet:
  issue_title: "personal-domain-controls-web-ui: shuttlepub-web の個人 domain mute/block 設定 UI (実 Emumet 接続・解除時非復元の説明・投稿表示面の S8 準拠 mock。画面構成はモック合意後)"
  issue_kind: feature
  source_execution_unit: personal-domain-controls-web-ui
  domain: shuttlepub
  target_repo: ShuttlePub/shuttlepub-frontends
  target_path: "apps/shuttlepub-web (BFF・GraphQL・画面・e2e), packages/ui (必要な場合のみ)"
  target_part: "shuttlepub-web の domain mute/block 設定 UI、解除時に関係が復元されない旨の説明、FA 経由の実 Emumet 接続 (domain-controls と Follow 解除の確認)、投稿表示面 (引用・boost 全体非表示、単一投稿 reveal) の S8 準拠 mock"
  dependencies:
    - "shuttlepub-web-foundation"
    - "shuttlepub-web-emumet-auth"
    - "profile-domain-policy-api-contract"
    - "profile-domain-block-detach"
    - "personal-domain-content-api-contract"
  technical_baseline:
    - "durable state、packet、intent、queue の正本は ShuttlePub/host のみ。frontends 側に親状態を作成しない。"
    - "F0 (shuttlepub-web-foundation) の apps/shuttlepub-web・OpenAPI 取込基盤・BFF と、FA (shuttlepub-web-emumet-auth、PR #32 マージ済み) の Hydra OIDC 認証・HttpOnly session・Emumet Bearer 転送 (audience=account)・認証済み Profile 選択の上に実装する。新しい認証方式は作らない"
    - "Emumet の契約: E8 (Emumet#66 / PR #70) の domain-controls (GET /api/v1/profiles/{profile_nanoid}/domain-controls、GET/PUT/DELETE .../{domain})。revision は 1 始まり、PUT は expected_revision 省略で新規 (既存なら 409)・指定時は一致のみ置換 (不一致・同時削除は 409)、DELETE は expected_revision 必須、不正 domain は 422 (D8P で 400 から変更)、所有者のみ (401/403/404)。domain は完全一致で、応答の domain は常に正規化形 (IDNA 等)。詳細は host の DC acceptance.md の『E8 確定契約』『D8P 確定契約』"
    - "Emumet の実処理: D8P は保存を実装済みだが domain-controls route は本番未 mount。block の関係解除は D8R、Follow の拒否は D8G、本番 mount は P4 マージ後の D8R。したがって実 Emumet 接続の最終受け入れは D8R のマージ後。それ以前は E8/D8P 契約準拠の stateful mock で先行する"
    - "D08 の区分: Follow 制御 (新規 Follow 拒否・既存関係の両方向解除) だけが Emumet で実適用される。投稿の抑制 (timeline・検索・通知の表示抑制、引用・boost 全体非表示、単一投稿 reveal) と新規反応・返信・引用・リポストの受理/送信拒否は ShuttlePub の後続責務で未実装。UI は投稿側が実施済みであるかのように表示してはならない (mock/未接続と明示する)"
    - "S8 (personal-domain-content-api-contract、shuttlepub domain、ShuttlePub/ShuttlePub、E8 に依存する契約のみの unit) が投稿・検索・通知の抑制契約、引用・純粋 boost 全体非表示、直接閲覧時の単一投稿 reveal、hidden 応答に本文等を漏らさないこと、reveal で block/CW/閲覧権を解除しないことを契約化する。投稿表示面の mock は S8 の生成 schema に準拠させる。host の queue では S8 は本 packet 作成時点で未登録で、別レーンで登録される (queue 登録後に dependencies へ追加する)。S8 が確定するまで、この投稿表示面 mock の実装は進めない"
    - "mock 合意前の区分: 【先行可 (画面構成に依存しない)】domain-controls の BFF REST→GraphQL 変換、型生成、stateful mock (revision 競合・完全一致・Profile 分離・解除後非復元を再現)、S8 準拠の投稿 hidden/reveal fixture のデータ層と検証、Emumet 実接続の BFF 部分 (mock/real 切替)。【モック合意後】domain mute/block 設定画面、解除時非復元の説明の配置、投稿表示面 (引用・boost 全体非表示・単一投稿 reveal) の画面構成"
    - "【モック合意ゲート】画面構成 (レイアウト・画面遷移・デザイン) を決める UI 実装は、ユーザーとのモック合意が成立するまで実装 PR を出さない。モック合意は host の intent (ShuttlePub/host の intents/shuttlepub/ 配下) に記録される。画面実装を始める前にその合意記録を参照し (場所はこの issue 上のコメントで示される)、合意内容に従う。合意前に画面構成を独自に決めて実装しない。D08 のモック案は lead thread thread-xxs52dcx の artifact (artifact-05443f92d47738ca697b17e04b6febf8 等) にあるが、ユーザー合意は未成立 (合意記録ができるまで仕様として扱わない)。画面構成に依存しない部分は合意を待たずに先行してよい"
    - "UI の意味 (D08 決定): mute は表示を抑制するが関係を切らない。block は表示抑制に加え対象 domain との既存 Follow/Follower を両方向に解除し、解除しても関係は復元されず復元用一覧も保持されない (再フォローは利用者の操作)。AP Block は送らない。完全一致のみ (example.com の設定は sub.example.com に適用されない)。設定は投稿用 Profile ごとで、同じ Account 内の別 Profile や他 Account に波及せず、全体 HostModeration にもならない"
    - "外部 ID は nanoid。Profile 選択は FA の Profile context を使う。access token は BFF が保持しブラウザに渡さない (FA の方式)"
    - "schema 取込は F0 の方式 (producer commit SHA + checksum で固定した生成 OpenAPI → TS 型 → アプリ所有 GraphQL SDL → PureScript 型、fixture は OpenAPI に照合)。bff/schema.graphql・生成型は他 unit (FN・F15・F3 等) と直列に統合する"
    - "実 Emumet 接続の E2E は FA の実 Kratos/Hydra/Emumet 構成を流用する。mock と real の切替は明確にし、501 を成功扱いしない"
  intent_references:
    - "intents/shuttlepub/product/social-experience.md (I08)"
    - "intents/shuttlepub/packets/candidates.md (D08 節、共通の分割方針)"
    - "intents/shuttlepub/interviews/discord-feature-grill-2026-10-15.json (d08-q01〜q15)"
    - "intents/shuttlepub/interviews/discord-feature-prioritization-2026-11-09.json (candidate-priority-q01〜q03)"
    - "intents/emumet/features/personal-domain-controls/overview.md"
    - "intents/emumet/features/personal-domain-controls/packets.md"
    - "intents/emumet/features/personal-domain-controls/acceptance.md"
    - "intents/emumet/features/profile-federation/overview.md"
    - ".intent-cli/issues/shuttlepub-web-foundation/ (F0 packet)"
    - ".intent-cli/issues/shuttlepub-web-emumet-auth/ (FA packet)"
    - ".intent-cli/issues/profile-domain-policy-api-contract/ (E8 packet)"
    - ".intent-cli/issues/profile-domain-block-detach/ (D8R packet)"
  acceptance_criteria:
    - "【実接続・D8R マージ後】FA 経由の実ログイン (Kratos/Hydra) から、選択した Profile で domain mute/block を実保存・再取得でき、block 設定で対象 domain との Follow/Follower 関係が実際に解除されることまで、実 Emumet に対する E2E で確認する"
    - "設定は Profile ごとに分離され、Profile 切替で別 Profile の設定を混ぜない。同一 Account の別 Profile・他 Account の Profile に波及しない"
    - "revision 競合 (409)・不在 (404)・不正 domain (422)・未認証/権限不足 (401/403) を、黙って成功扱いにせず利用者に分かる形で扱う (再取得・再試行の導線を含む)。二重送信で状態が壊れない"
    - "domain は完全一致で扱い、sub.example.com に example.com の設定が適用されると誤認させない表示にする。サーバーが返す正規化形の domain を表示する"
    - "block 解除後に関係が復元されないこと (再フォローは利用者操作) の説明が UI にあり、解除後に Follow/Follower が実際に戻らないことを (実接続後は) 確認する"
    - "Follow 制御 (新規 Follow 拒否・既存関係解除) は実適用として扱い、投稿表示の抑制・反応拒否は mock/未接続と UI 上で明示する。投稿側が実施済みであるかのような表示をしない"
    - "投稿表示面の mock が S8 準拠で、引用 (コメント付き引用の全体)・純粋 boost の全体非表示、単一投稿の明示 reveal、reveal しても CW・閲覧権が維持されること、hidden 応答に本文等が含まれないことを fixture で検証する"
    - "mock と実接続の切替が明確で、501 や未接続を成功として表示しない。dev API や契約外 API を呼ばない"
    - "画面構成 (レイアウト・画面遷移・デザイン) を決める UI 部分は、host intent に記録されたユーザーとのモック合意に従って実装され、その合意記録を参照して作られている (合意前の独自画面構成を含まない)"
    - "キーボード操作でも設定・解除の導線が使え、SSR/hydration・mobile/desktop の visual baseline が通る。既存 CI が通る"
  revision_history:
    - "2026-11-11: 範囲の具体化 (親判断 question-e944b2435f1cdc4f64c77966d9be6b0e)。S8 (personal-domain-content-api-contract) が host queue 未登録・packet なしで、shuttlepub-web に投稿・TL・プロフィール画面が無い (SNS 本体 shell は F0 layout #27 で作業中) ため、F8 は 2 段に分ける。第1段 = 設定「ミュート・ブロック」画面 (ui-spec 1-1〜1-6・2-1〜2-5、ブロック解除/ミュート変更ダイアログ) + BFF + 実 Emumet 接続 ([shuttlepub-frontends PR #40](https://github.com/ShuttlePub/shuttlepub-frontends/pull/40)、Refs #35)。第2段 = 投稿表示面 (ui-spec 3-x・4-1・5-x) と投稿/プロフィールの「…」メニュー (主導線)。第2段は S8 の契約確定と F0 layout のマージ後の別 PR。第1段のマージだけでは F8 は完了しない (issue #35 は open のまま)"
    - "2026-11-11: 範囲拡大 (親判断 question-264025add8f063e784847caf6de38bed、合意済み ui-spec 1-2/1-6 に基づく)。設定画面の『アカウント』タブに、Emumet の個別 blocks/mutes API (E8 契約・P3o 実装・本番 mount は P4) による個別アカウントの mute/block 一覧と解除 (ミュート解除の元に戻す、ブロック解除の［ミュートに変更］) を含める。個別アカウントの追加は主導線 (第2段) 側。Emumet の個別 relation 応答は対象の canonical actor URL だけで名前・アイコン・acct が無いため、行は actor URL 表示 (ui-spec 1-6 との差分。名前等は Emumet 側 API 追加が必要)。個別 block は AP Block を送る仕様 (question-e6dfa2b98a9dc74491b19bbcf2ba5ca4) だが画面に説明は置かない (ui-spec の引き算どおりで文言の食い違いなし)"
    - "2026-11-12: 第1段マージ。[shuttlepub-frontends PR #40](https://github.com/ShuttlePub/shuttlepub-frontends/pull/40) を squash `cb02b99` で main にマージ (独立 Reviewer 承認、CI green、ユーザー方針 question-38f81bb0ff33dd1082bf35e1ebbd8ece)。到達: 設定「ミュート・ブロック」画面 (ドメイン・アカウント両タブ) + BFF + 実 Emumet 接続 (固定 OpenAPI は Emumet main 82fa49b = D8R・P4 マージ後)。自サーバー判定は EMUMET_PUBLIC_HOST (Emumet PUBLIC_BASE_URL の host)。実 E2E は Emumet main 82fa49b の release ビルドに対しローカルで 2/2 pass を 2 回連続。F8 は部分完了のまま: 第2段 (投稿表示面 ui-spec 3-x・4-1・5-x と投稿/プロフィールの「…」メニュー) は S8 待ち。issue #35 は open のまま (closeout しない)。引継ぎ: (1) F8 の実 Emumet E2E シナリオ（Kratos/Hydra ログイン → BFF → Emumet、自サーバー拒否・peer domain block での Follow 解除・解除後非復元・409・Profile 分離・アカウントタブ）はスクラッチで実行しリポジトリ未移設。shuttlepub-frontends の `apps/shuttlepub-web/e2e` へ移し、Keto を含む compose と `e2e/emumet-revision` を Emumet main 82fa49b 以降に更新する。(2) アカウントタブの行は Emumet の個別 relation 応答が canonical actor URL しか返さないため actor URL 表示（ui-spec 1-6 のアイコン・名前・acct には Emumet 側の API 追加が必要）。"
    - "2026-11-12: S8 マージに伴う依存追加。S8 personal-domain-content-api-contract (ShuttlePub#18 / [ShuttlePub PR #19](https://github.com/ShuttlePub/ShuttlePub/pull/19)、squash `60cb47d60da3c5b4ff3fc570fe3bc1796f983b3b`、host `af73b89` で closeout、契約のみ・全 route 501) を dependencies に追加 (technical_baseline の『queue 登録後に dependencies へ追加する』の実施。queue-state も同じく追加)。technical_baseline の『S8 は未登録』『S8 が確定するまで投稿表示面 mock を進めない』は作成時点の記述で、S8 確定により第2段 (投稿表示面 ui-spec 3-x・4-1・5-x と投稿/プロフィールの「…」メニュー) に着手する。第2段は S8 の生成 OpenAPI を 60cb47d6 のフル SHA に固定して F0 の方式で取り込み、実接続は ShuttlePub 側の実装後 (UI 上は未接続と明示)。S8 の DirectItem の説明どおり、boost wrapper の直接 reveal は S8 範囲外で未決。issue #35 の本文 Dependencies 節を同期"
    - "2026-11-12: 第2段 PR 作成。[shuttlepub-frontends PR #46](https://github.com/ShuttlePub/shuttlepub-frontends/pull/46) (Closes #35、未マージ)。投稿表示面 (ui-spec v5 3-1〜3-6・4-1〜4-5・5-1) と投稿/プロフィールの「…」メニュー (1-1 主導線) を S8 生成 schema (ShuttlePub 60cb47d60da3c5b4ff3fc570fe3bc1796f983b3b 固定、producer fixture も同 commit で取込) 準拠の mock で実装。real の投稿系は投稿表示データの契約がないため従来どおり NOT_IMPLEMENTED。ui-spec 3-4 との差 (親判断 question-0a21540d4dea17e4270185f0232739fa、S8 優先・データを漏らさない設計を維持): (1) 引用を直接開いたときの隠し表示は 3-1 と同じ『〈種別〉中のドメインの投稿です』＋ドメインで『引用しています／引用元:』を出さない (S8 の hidden 応答は state・mode・domain・revision のみで引用かどうかを含まない)、(2) 引用を reveal しても引用元は隠し表示のまま (S8 EmbeddedNotePresentation)。ui-spec どおりにするには S8 契約の拡張 (後続) が必要。純粋 boost の直接 URL reveal (S8 未決) は、boost wrapper 固有の画面・URL を作らず元投稿 URL の通常の単一投稿 reveal に委ねる方針で実装 (TL では純粋 boost を全体ごと痕跡なく除く)。通知・検索 (5-2/5-3) は画面が後続 unit のため UI なし (BFF の S8 投影と fixture 検証のみ)"
