implementation_issue_packet:
  issue_title: "hydra-oidc-real-e2e: booskiff-web real モード (Hydra OIDC) E2E — Hydra+Kratos 入り compose での認証フロー実検証"
  issue_kind: feature
  source_execution_unit: hydra-oidc-real-e2e
  domain: ratcap
  target_repo: ShuttlePub/shuttlepub-frontends
  target_path: "apps/booskiff-web/e2e, compose.e2e.yml (または新規 compose.e2e.real.yml), .github/workflows"
  target_part: "booskiff-web の real モード (USE_MOCK=false, Hydra OIDC) 認証フローを実スタックで検証する E2E 基盤"
  dependencies: []
  technical_baseline:
    - "前提: apps/booskiff-web は main に存在し、mock モード (USE_MOCK=true) の実スタック E2E が compose.e2e.yml + Playwright で 16 件動作している (drive-web-ui + issue #10 / PR #14 時点)"
    - "real OAuth 経路 (bff/auth-real.ts) は emumet-web からの踏襲で単体テスト済み: PR #14 で id_token 署名/issuer/audience/expiry 検証・missing_id_token の fail-closed・auth ルート method 405・/api mutation の Origin/Referer 検証が追加され、mock JWKS サーバーによる単体テスト 97 件でカバー済み"
    - "未カバー: 実 Hydra+Kratos を起動した E2E。トークン交換・JWKS 取得・セッション発行が実設定で通ることの検証が存在しない (issue #10 Medium-2 として分離された経緯)"
    - "emumet-web (同 monorepo または sibling) に real OAuth 経路の先例あり。Hydra/Kratos の compose 設定はそこから移植可能"
    - "Kratos 側のテストユーザー (identity) は seed/provisioning スクリプトで作成する設計とする"
  intent_references:
    - "intents/ratcap/intent-tree/00-map.md"
    - "intents/ratcap/features/oauth2-consent/packets.md"
  acceptance_criteria:
    - "Hydra+Kratos 入り compose で USE_MOCK=false の booskiff-web スタックが起動し、Playwright で real OAuth ログイン → callback → セッション発行 → 認証済み drive 操作 → logout の一連の E2E がパスする"
    - "不正な認証応答 (改ざん/欠落 id_token 等、実 Hydra 設定で再現可能な範囲) でログインが失敗しセッションが発行されないことが実地で確認できる"
    - "既存の mock モード E2E (16 件) と単体テスト (bun test / spago test) が引き続き全パスし、CI で mock/real 両スイートが green になる"
  revision_history:
    - "2026-09-13: 初版。shuttlepub-frontends issue #10 Medium-2 (real モード Hydra OIDC E2E 不在) をオペレーター決定で PR #14 から分離し、独立 unit として packet 化。"

