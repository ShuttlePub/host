<style>

}
[data-color="tokyo-night"] {
  --theme-bg-primary: #1a1b26; --theme-bg-secondary: #16161e; --theme-bg-surface: #24283b;
  --theme-bg-nav: rgba(26, 27, 38, 0.9); --theme-text-primary: #a9b1d6; --theme-text-secondary: #787c99;

  background: var(--theme-bg-primary); color: var(--theme-text-primary); -webkit-font-smoothing: antialiased; line-height: 1.5; }

/* --- mock chrome --- */

.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--theme-accent) 18%, transparent); color: var(--theme-accent); font-weight: 600; }

.device-label { text-align: center; font-size: 11px; color: var(--theme-text-muted); margin-top: 8px; }
.side { position: sticky; top: 64px; max-height: calc(100vh - 84px); overflow: auto; padding: 18px; background: var(--theme-bg-secondary);
  border: 1px dashed var(--theme-border); border-radius: 12px; font-size: 13px; }
@media (max-width: 1240px) { .side { position: static; max-height: none; } }

  background: color-mix(in srgb, var(--theme-bg-surface) 35%, transparent); }
.spec-no { flex: none; font-size: 11px; font-weight: 700; color: var(--theme-accent); min-width: 26px; padding-top: 1px; }

/* --- app (mirrors ShuttlePub.UI.Theme / Layout) --- */
.app { display: flex; flex-direction: column; min-height: 100%; background: var(--theme-bg-secondary); color: var(--theme-text-primary); font-size: 14px; }
.nav { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); background: var(--theme-bg-nav); border-bottom: 1px solid var(--theme-border); }
.nav-inner { max-width: 56rem; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.av.xs { width: 22px; height: 22px; font-size: 10px; border-radius: calc(var(--theme-radius) * .6); }
.av.sm { width: 28px; height: 28px; font-size: 12px; }
.av.lg { width: 80px; height: 80px; font-size: 28px; border: 4px solid var(--theme-bg-secondary); border-radius: var(--theme-radius-lg); }
.av.c2 { background: #89b4fa; } .av.c3 { background: #a6e3a1; } .av.c4 { background: #fab387; } .av.c5 { background: #f9e2af; } .av.c6 { background: #94e2d5; }

.surface { border-radius: var(--theme-radius-lg); border: 1px solid var(--theme-border); background: var(--theme-bg-surface); box-shadow: var(--theme-shadow); }
.h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--theme-text-heading); margin: 0; line-height: 1.25; }

.muted { color: var(--theme-text-muted); } .sec { color: var(--theme-text-secondary); }
.xs { font-size: 12px; } .small { font-size: 13px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.row { display: flex; align-items: center; gap: 12px; } .wrap { flex-wrap: wrap; } .between { justify-content: space-between; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 12px; font-size: 12px; font-weight: 500; min-height: 30px;
  color: var(--theme-accent); border: 1px solid var(--theme-border); border-radius: var(--theme-radius); white-space: nowrap; text-decoration: none; }
.btn:hover { opacity: .85; }

.input { width: 100%; padding: 8px 12px; font-size: 14px; min-height: 40px; border: 1px solid var(--theme-border); background: var(--theme-bg-surface); color: var(--theme-text-primary); border-radius: var(--theme-radius); }
.input:focus { outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--theme-accent) 50%, transparent); }

.badge.mute { color: var(--theme-temp-low); background: color-mix(in srgb, var(--theme-temp-low) 14%, transparent); }
.badge.block { color: var(--theme-error); background: color-mix(in srgb, var(--theme-error) 14%, transparent); }
.badge.neutral { color: var(--theme-text-secondary); background: color-mix(in srgb, var(--theme-text-muted) 22%, transparent); }
.ico { width: 18px; height: 18px; display: inline-block; vertical-align: middle; flex: none; }
.ico.sm { width: 15px; height: 15px; } .ico.lg { width: 32px; height: 32px; }

/* settings */
.settings { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 32px; }
.subnav { font-size: 13px; }

/* posts */
.feed { overflow: hidden; }
.post { position: relative; padding: 14px 16px 10px; border-top: 1px solid var(--theme-border); display: flex; gap: 12px; }

.post-more { position: absolute; top: 8px; right: 8px; }

.quote { border: 1px solid var(--theme-border); border-radius: var(--theme-radius); padding: 8px 12px; margin: 4px 0 8px; font-size: 13px; }
.actions { display: flex; gap: 14px; flex-wrap: wrap; margin-left: -8px; }
.act { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: var(--theme-radius); color: var(--theme-text-secondary); font-size: 12px; min-height: 32px; }
.act:hover { background: color-mix(in srgb, var(--theme-text-muted) 18%, transparent); color: var(--theme-accent); }
.act.locked { color: var(--theme-text-muted); }
.act .lock { position: absolute; left: 17px; top: calc(50% - 13px); width: 11px; height: 11px; padding: 1px; border-radius: 50%; background: var(--theme-bg-surface); }
.act.locked { padding-left: 10px; }
.act { position: relative; }
.act .lbl { display: none; }

.reveal-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 16px; font-size: 12px; color: var(--theme-text-muted); border-bottom: 1px solid var(--theme-border); }
.collapsed { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 16px; font-size: 13px; color: var(--theme-text-muted); border-top: 1px solid var(--theme-border); text-align: left; }
.collapsed:hover { color: var(--theme-accent); }
.mini-hidden { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px 8px 28px; font-size: 12px; color: var(--theme-text-muted); border-top: 1px dashed var(--theme-border); }
.urlbar { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 12px; border: 1px dashed var(--theme-border); border-radius: 999px; color: var(--theme-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 16px; }
.profile-banner { height: 140px; border-radius: var(--theme-radius-lg); background: linear-gradient(90deg, color-mix(in srgb, var(--theme-accent) 30%, transparent), color-mix(in srgb, var(--theme-accent) 10%, transparent)); }
.profile-head { display: flex; align-items: flex-end; gap: 16px; margin-top: -40px; padding: 0 16px; flex-wrap: wrap; }
.debug-hidden { opacity: .55; border-top: 1px solid var(--theme-border); background: repeating-linear-gradient(135deg, transparent 0 10px, color-mix(in srgb, var(--theme-error) 8%, transparent) 10px 20px); }
.debug-hidden .post { border-top: 0; padding-top: 2px; }
.debug-tag { display: block; padding: 6px 16px 0; font-size: 11px; font-weight: 700; color: var(--theme-error); }
.debug-ok { font-size: 11px; color: var(--theme-temp-low); }

/* overlays */
.overlay { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 24px; }
.dialog { width: 100%; max-width: 440px; max-height: calc(100% - 24px); overflow: auto; background: var(--theme-bg-primary); border: 1px solid var(--theme-border); border-radius: var(--theme-radius-lg); box-shadow: 0 16px 56px rgba(0,0,0,.45); }

.impact summary { cursor: pointer; color: var(--theme-accent); font-size: 12px; margin-top: 4px; }

.toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; display: flex; gap: 12px; align-items: center; width: max-content; max-width: calc(100% - 32px);
  padding: 10px 14px; font-size: 13px; background: var(--theme-bg-surface); border: 1px solid var(--theme-border); border-radius: var(--theme-radius); box-shadow: 0 8px 28px rgba(0,0,0,.4); }
.menu-layer { position: absolute; inset: 0; z-index: 25; }

.pmenu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: calc(var(--theme-radius) * .6); text-align: left; font-size: 14px; }
.pmenu button:hover, .pmenu button:focus-visible { background: var(--theme-bg-surface); }

.chip-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 13px; }

@container (max-width: 640px) {
  .nav-inner { padding: 0 16px; height: 56px; }
  .nav-links { display: none; }
  .profile-chip .handle { display: none; }
  .tabbar { display: flex; position: sticky; bottom: 0; z-index: 10; justify-content: space-around; border-top: 1px solid var(--theme-border); background: var(--theme-bg-nav); backdrop-filter: blur(12px); padding: 6px 0 10px; }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--theme-text-secondary); padding: 4px 10px; min-width: 56px; text-decoration: none; }
  .tabbar a[aria-current="page"] { color: var(--theme-accent); }
  .content { padding: 16px 12px 32px; }
  .h1 { font-size: 22px; }
  .settings { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .subnav { display: none; }
  .mobile-back { display: inline-flex; margin: 0 0 4px -8px; }
  .overlay { align-items: flex-end; padding: 0; }
  .dialog { max-width: none; border-radius: var(--theme-radius-lg) var(--theme-radius-lg) 0 0; max-height: 92%; border-bottom: 0; }

  .menu-layer { background: rgba(0,0,0,.55); }

  .profile-head > .grow { order: 3; flex-basis: 100%; }

  .profile-banner { height: 110px; }
  .act { padding: 8px 6px; min-height: 40px; }
  .actions { justify-content: space-between; flex-wrap: nowrap; margin-left: -6px; }
  .toast { bottom: 84px; }
}


.doc { max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; }
.doc h1 { font-size: 24px; color: var(--theme-text-heading); margin: 0 0 6px; }

/* === v4 density: Misskey (MkNote ≤480px: 14px 16px / MI-margin 10px) と X の投稿セル密度に寄せる（Tailwind spacing の 4px 刻み） === */
body { line-height: 1.4; }
.content { padding: 24px 24px 32px; }
.stack > * + * { margin-top: 16px; }
.h1 { font-size: 22px; }
.page-title { margin-bottom: 8px; }
.filter-row { margin: 12px 0 8px; min-height: 36px; }
.chip { padding: 4px 10px; }
.tabs button { padding: 8px 12px; }
.entry { padding: 10px 16px; gap: 10px; }
.row-action { min-width: 96px; flex: none; }

  s = s.replace(/^acct:/i, '');
  const accM = s.match(/^@?[^@\s\/]+@([^@\s\/]+)$/);
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) { try { s = new URL(s).host; } catch (e) { return { error: 'ドメインの形式が正しくありません' }; } }
  else if (accM) s = accM[1];
  else if (s.includes('/')) s = s.split('/')[0];
  s = s.replace(/:\d+$/, '').replace(/\.+$/, '').toLowerCase();
  let ascii; try { ascii = new URL('http://' + s).hostname; } catch (e) { return { error: 'ドメインの形式が正しくありません' }; }
  if (/^\d+(\.\d+){3}$/.test(ascii) || ascii.includes('[')) return { error: 'IP アドレスは指定できません' };
  if (!ascii.includes('.') || !/^[a-z0-9.-]+$/.test(ascii) || ascii.split('.').some(l => !l || l.startsWith('-') || l.endsWith('-'))) return { error: 'ドメインの形式が正しくありません' };
  if (ascii === SERVER) return { error: '自分のサーバーは指定できません' };
  return { domain: ascii, display: s };
}
function impactOf(domain) {
  if (domain === D0) return {
    following: [['alice', 'Alice', 'c2'], ['bob_dev', 'Bob', 'c3'], ['kumo', 'くも', 'c5']],

  };
  if (domain === 'noisy.social') return { following: [['nana', 'Nana', 'c4']], followers: [] };
  return { following: [], followers: [] };
}

          <button class="icon-btn outlined" data-act="pmenu" data-profile="1" aria-label="その他" aria-haspopup="menu">${ic('dots')}</button>
          ${follow}
        </div>
      </div>
      <p class="sec small bio">アニメとカメラが好き。週末は写真散歩。</p>
    </div>
    ${list}
  </div>`;
}

/* ---------- ⑥ surfaces ---------- */
function surfacesHTML() {
  const t = S.surf.tab, dbg = S.surf.debug;
  const wrapHidden = (reason, inner) => dbg ? `<div class="debug-hidden"><span class="debug-tag">説明用・実際には非表示: ${reason}</span>${inner}</div>` : '';
  let html = '';
  if (t === 'home') {
    POSTS.forEach(p => {
      const h = hiddenBy(p);
      if (h) { const why = p.quote ? '第三者の引用（全体）' : p.boostBy ? 'リポスト（全体）' : `${kindLabel(h)}中のドメイン`; html += wrapHidden(why, postHTML(p, { noMenu: true })); }
      else html += postHTML(p, { noMenu: true, extra: dbg && p.domain === 'sub.example.social' ? '<div class="debug-ok">説明用: サブドメインは対象外</div>' : '' });
    });
    html += postHTML({ id: 'me', a: prof().initial, name: prof().name, handle: prof().handle, domain: SERVER, text: '散歩のついでに写真を撮った', cls: prof().cls }, { noMenu: true, counts: [2, 1, 0, 12, 4], extra: dbg ? '<div class="debug-ok">説明用: いいね 12 はブロック前の example.social からの 3 件を含み、減らない</div>' : '' });
  } else if (t === 'notif') {
    const n = (icn, text, ch, cls) => `<article class="post"><span class="av sm ${cls}" aria-hidden="true">${ch}</span><div class="grow small row" style="gap:8px">${ic(icn, 'sm')}<span>${text}</span></div></article>`;
    html += n('heart', 'Mio さんがいいねしました', 'M', 'c3');
    html += wrapHidden('対象ドメインからのフォロー', n('bell', 'Sora さん（@sora@example.social）にフォローされました', 'S', 'c2'));
    html += wrapHidden('対象ドメインからのリアクション', n('smile', 'Alice さん（@alice@example.social）がリアクションしました', 'A', 'c2'));
    html += n('reply', 'Hiro さんが返信しました', 'H', 'c4');
  } else {
    html += `<div style="padding:12px 16px"><input class="input" value="写真散歩" aria-label="検索"></div>`;
    html += wrapHidden('対象ドメインの投稿', postHTML(POSTS[4], { noMenu: true }));
    html += postHTML({ id: 's1', a: 'H', name: 'Hiro', handle: 'hiro', domain: 'other.example', text: '写真散歩で使うレンズの話', cls: 'c4' }, { noMenu: true });
  }
  const tab = (id, l) => `<button role="tab" aria-selected="${t === id}" data-act="surfTab" data-tab="${id}">${l}</button>`;
  return `<section class="surface feed"><div class="tabs" role="tablist" aria-label="表示面" style="padding:0 8px">${tab('home', 'ホーム')}${tab('notif', '通知')}${tab('search', '検索')}</div><div role="tabpanel">${html}</div></section>`;
}

/* ---------- side panel ---------- */
function scenRow(label, key, cur, opts) {
  return `<div class="scen-row"><span>${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v, l]) => `<button aria-pressed="${cur === v}" data-act="scen" data-key="${key}" data-val="${v}">${l}</button>`).join('')}</div></div>`;
}
function sideHTML() {
  const sp = SCREEN_SPEC[S.screen];
  const st = stateOf(D0) || '';
  let scen = '';
  if (S.screen === 'menu') scen = `<p class="mock-note">投稿右上の「…」から操作。<span class="mono">example.social</span> の投稿（Alice、Ken の引用、リポスト）が消えるのを確認できる。設定②にも反映される。</p>` + scenRow('example.social', 'domain', st, [['', 'なし'], ['mute', 'ミュート'], ['block', 'ブロック']]);
  if (S.screen === 'settings') scen = `<p class="mock-note">「+」→ 例: <span class="mono">https://Example.social/@alice</span> → 確認で <span class="mono">example.social</span> に正規化。Profile はナビのチップで切替。</p>`;
  if (S.screen === 'confirm') scen = `<div class="row wrap" style="gap:6px">
      <button class="btn" data-act="openBlock" data-domain="${D0}">ブロック（関係 8 件）</button>
      <button class="btn" data-act="openBlock" data-domain="quiet.example">ブロック（関係 0 件）</button>
      <button class="btn" data-act="demoInput">直接入力 → ミュート</button>
      <button class="btn" data-act="openUnblock" data-domain="bot-farm.example">ブロック解除</button></div>`;
  if (S.screen === 'direct') scen = scenRow('example.social', 'domain', st, [['block', 'ブロック'], ['mute', 'ミュート'], ['', 'なし']]) + scenRow('開いた投稿', 'src', S.direct.src, [['own', '対象ドメインの投稿'], ['quote', '第三者の引用']]) + scenRow('CW', 'cw', S.direct.cw ? '1' : '0', [['1', 'あり'], ['0', 'なし']]);
  if (S.screen === 'profile') scen = scenRow('example.social', 'domain', st, [['block', 'ブロック'], ['mute', 'ミュート'], ['', 'なし']]) + `<p class="mock-note">プロフィール情報は表示し、投稿一覧だけを隠す。［投稿を表示］後の鍵付きボタンや、フォロー・「…」メニューからの解除も試せる。</p>`;
  if (S.screen === 'surfaces') scen = scenRow('説明用表示', 'debug', S.surf.debug ? '1' : '0', [['1', 'ON'], ['0', 'OFF（実際）']]) + scenRow('example.social', 'domain', st, [['block', 'ブロック'], ['mute', 'ミュート'], ['', 'なし']]);
  return `<h2>${esc(sp.title)}</h2><p>${esc(sp.desc)}</p>
    ${scen ? `<h3>シナリオ</h3><div class="scen">${scen}</div>` : ''}
    <h3>採用した仕様</h3><ul class="spec">${sp.nos.map(n => `<li><span class="spec-no">${n}</span><span>${esc(SPEC[n])}</span></li>`).join('')}</ul>`;
}

/* ---------- render ---------- */
function appActive() {
  if (S.screen === 'settings' || S.screen === 'confirm') return 'settings';
  if (S.screen === 'surfaces') return S.surf.tab;
  if (S.screen === 'menu') return 'home';
  return '';
}
function screenHTML() {
  switch (S.screen) {
    case 'menu': return homeHTML();
    case 'settings': case 'confirm': return settingsHTML();
    case 'direct': return directHTML();
    case 'profile': return profileHTML();
    case 'surfaces': return surfacesHTML();
  }
  return '';
}
function renderBar() {
  document.getElementById('screenSeg').innerHTML = SCREENS.map(s => `<button aria-pressed="${S.screen === s.id}" data-act="screen" data-id="${s.id}">${s.label}</button>`).join('');
  document.getElementById('deviceSeg').innerHTML = [['desktop', 'デスクトップ'], ['mobile', 'モバイル 390px']].map(([v, l]) => `<button aria-pressed="${S.device === v}" data-act="device" data-v="${v}">${l}</button>`).join('');
  const c = document.documentElement.dataset.color, sh = document.documentElement.dataset.shape;
  document.getElementById('colorSeg').innerHTML = [['catppuccin-mocha', 'Catppuccin'], ['tokyo-night', 'Tokyo Night']].map(([v, l]) => `<button aria-pressed="${c === v}" data-act="color" data-v="${v}">${l}</button>`).join('');
  document.getElementById('shapeSeg').innerHTML = [['rounded', 'Rounded'], ['sharp', 'Sharp']].map(([v, l]) => `<button aria-pressed="${sh === v}" data-act="shape" data-v="${v}">${l}</button>`).join('');
}
function render(opts = {}) {
  renderBar();
  const sc = document.getElementById('scroller'); const prevScroll = sc ? sc.scrollTop : 0;
  const side = document.querySelector('.side'); const prevSide = side ? side.scrollTop : 0;
  const dl = document.querySelector('.dialog'); const prevDlg = dl ? dl.scrollTop : 0;
  const activeId = document.activeElement && document.activeElement.id;
  document.getElementById('root').innerHTML = `<div class="stage">
    <div>
      <div class="device-wrap"><div class="device ${S.device === 'mobile' ? 'mobile' : ''}" id="device">
        <div class="device-scroll" id="scroller"><div class="app" ${S.dialog || S.pmenu ? 'aria-hidden="true" inert' : ''}>
          ${navHTML(appActive())}<main class="content">${screenHTML()}</main>${tabbarHTML(appActive())}
        </div></div>
        ${pmenuHTML()}
        ${S.dialog ? `<div class="overlay" data-act="overlay">${dialogHTML()}</div>` : ''}
        <div aria-live="polite">${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ''}</div>
      </div></div>
      <div class="device-label">${S.device === 'mobile' ? 'モバイル幅 390px' : 'デスクトップ（ShuttlePub.UI.Layout の navBar / max-w-4xl 準拠）'}</div>
    </div>
    <aside class="side" aria-label="モック注記">${sideHTML()}</aside>
  </div>`;
  if (!opts.resetScroll) document.getElementById('scroller').scrollTop = prevScroll;
  document.querySelector('.side').scrollTop = opts.resetScroll ? 0 : prevSide;
  const ndl = document.querySelector('.dialog'); if (ndl && dl && !opts.focusDialog) ndl.scrollTop = prevDlg;
  let target = null;
  if (opts.focus) target = document.querySelector(opts.focus);
  else if (opts.focusDialog && ndl) target = ndl.querySelector('input, .dialog-foot button');
  else if (S.pmenu) target = document.querySelector('.pmenu button');
  else if (activeId) target = document.getElementById(activeId);
  if (target) target.focus({ preventScroll: true });
}
let toastTimer = null, undoInfo = null;
function toast(html, ms = 5000) { S.toast = html; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, ms); }
function setEntry(domain, kind) {
  const list = entries(); const e = list.find(x => x.domain === domain);
  if (!kind) { S.entries[S.profile] = list.filter(x => x.domain !== domain); return; }
  if (e) e.kind = kind; else list.unshift({ domain, kind, added: '2026/10/20' });
  S.hl = domain;
}
const md = s => `<span class="mono">${esc(s)}</span>`;

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (S.chipMenu) { S.chipMenu = false; render(); } return; }
  const a = el.dataset.act;
  if (a === 'overlay') { if (ev.target === el) { S.dialog = null; render(); } return; }
  if (a === 'closeMenu') { if (ev.target === el) { S.pmenu = null; render(); } return; }
  if (el.tagName === 'A') ev.preventDefault();
  if (a !== 'chip') S.chipMenu = false;
  const ro = {};
  switch (a) {
    case 'screen': S.screen = el.dataset.id; S.dialog = null; S.pmenu = null; S.toast = null;
      if (['direct', 'profile'].includes(S.screen) && !stateOf(D0)) setEntry(D0, 'block');
      if (S.screen === 'direct') Object.assign(S.direct, { revealed: false, cwOpen: false, repliesOpen: false, shownReplies: {} });
      if (S.screen === 'profile') S.profReveal = false;
      if (S.screen === 'confirm') S.dialog = { type: 'block', domain: D0, from: stateOf(D0) === 'mute' ? 'mute' : 'new' };
      render({ resetScroll: true }); window.scrollTo(0, 0); return;
    case 'device': S.device = el.dataset.v; break;
    case 'color': document.documentElement.dataset.color = el.dataset.v; break;
    case 'shape': document.documentElement.dataset.shape = el.dataset.v; break;
    case 'chip': S.chipMenu = !S.chipMenu; ro.focus = S.chipMenu ? '.chip-menu button' : '#profileChip'; break;
    case 'profile': S.profile = el.dataset.id; ro.focus = '#profileChip'; break;
    case 'go': { const to = el.dataset.to; if (to === 'settings') S.screen = 'settings'; else if (to === 'home' && S.screen !== 'surfaces') S.screen = 'menu'; else { S.screen = 'surfaces'; S.surf.tab = to; } render({ resetScroll: true }); return; }
    case 'pmenu': {
      const dev = document.getElementById('device').getBoundingClientRect(); const r = el.getBoundingClientRect();
      const bw = parseFloat(getComputedStyle(document.getElementById('device')).borderLeftWidth) || 0;
      S.pmenu = { post: el.dataset.post || null, top: Math.round(r.bottom - dev.top - bw + 4), right: Math.round(dev.right - r.right - bw) }; break;
    }
    case 'muteDomain': { const d = el.dataset.domain; S.pmenu = null; setEntry(d, 'mute'); undoInfo = { d, prev: null };
      toast(`<span>${md(d)} をミュートしました</span><button class="btn text" data-act="undo">元に戻す</button>`); break; }
    case 'unmuteDomain': { const d = el.dataset.domain; S.pmenu = null; setEntry(d, null); undoInfo = { d, prev: 'mute' };
      toast(`<span>${md(d)} のミュートを解除しました</span><button class="btn text" data-act="undo">元に戻す</button>`); break; }
    case 'undo': if (undoInfo) { setEntry(undoInfo.d, undoInfo.prev); undoInfo = null; S.toast = null; } break;
    case 'openBlock': { S.pmenu = null; const d = el.dataset.domain; S.dialog = { type: 'block', domain: d, from: stateOf(d) === 'mute' ? 'mute' : 'new' }; ro.focusDialog = true; break; }
    case 'openUnblock': S.pmenu = null; S.dialog = { type: 'unblock', domain: el.dataset.domain }; ro.focusDialog = true; break;
    case 'openAdd': S.dialog = { type: 'add', value: '' }; ro.focusDialog = true; break;
    case 'demoInput': S.dialog = { type: 'mute', domain: D0, fromInput: true }; ro.focusDialog = true; break;
    case 'addSubmit': {
      const kind = el.dataset.kind; const r = normalize(S.dialog.value || '');
      if (r.error) { S.dialog.error = r.error; ro.focus = '#addInput'; break; }
      const cur = stateOf(r.domain);
      if (cur === kind) { S.dialog.error = `すでに${kindLabel(kind)}しています`; ro.focus = '#addInput'; break; }
      S.dialog = kind === 'mute' ? { type: 'mute', domain: r.domain, fromInput: true, from: cur } : { type: 'block', domain: r.domain, fromInput: true, from: cur === 'mute' ? 'mute' : 'new' };
      ro.focusDialog = true; break;
    }
    case 'doMute': { const d = S.dialog.domain; setEntry(d, 'mute'); S.dialog = null; S.filter = 'all'; toast(`<span>${md(d)} をミュートしました</span>`); break; }
    case 'close': S.dialog = null; break;
    case 'chk': { S.dialog.checked = el.checked; const b = document.getElementById('confirmBlock'); if (b) b.disabled = !el.checked; return; }
    case 'muteInstead': { const d = S.dialog.domain; setEntry(d, 'mute'); S.dialog = null; toast(`<span>${md(d)} をミュートしました</span>`); break; }
    case 'doBlock': { const d = S.dialog.domain; setEntry(d, 'block'); S.dialog = null; S.filter = 'all'; toast(`<span>${md(d)} をブロックしました</span>`); break; }
    case 'doUnblock': { const d = S.dialog.domain; setEntry(d, null); S.dialog = null; toast(`<span>${md(d)} のブロックを解除しました</span>`); break; }
    case 'blockToMute': { const d = S.dialog.domain; setEntry(d, 'mute'); S.dialog = null; toast(`<span>${md(d)} をミュートに変更しました</span>`); break; }
    case 'filter': S.filter = el.dataset.f; ro.focus = `[data-act="filter"][data-f="${S.filter}"]`; break;
    case 'accFilter': S.accFilter = el.dataset.f; ro.focus = `[data-act="accFilter"][data-f="${S.accFilter}"]`; break;
    case 'profReveal': S.profReveal = true; ro.focus = '[data-act="profHide"]'; break;
    case 'profHide': S.profReveal = false; ro.focus = '[data-act="profReveal"]'; break;
    case 'setTab': S.setTab = el.dataset.tab; ro.focus = `[data-tab="${S.setTab}"]`; break;
    case 'reveal': S.direct.revealed = true; ro.focus = '[data-act="hideAgain"]'; break;
    case 'hideAgain': S.direct.revealed = false; S.direct.cwOpen = false; ro.focus = '[data-act="reveal"]'; break;
    case 'cwToggle': S.direct.cwOpen = !S.direct.cwOpen; ro.focus = '[data-act="cwToggle"]'; break;
    case 'toggleReplies': S.direct.repliesOpen = !S.direct.repliesOpen; ro.focus = '[data-act="toggleReplies"]'; break;
    case 'showReply': S.direct.shownReplies[el.dataset.id] = true; break;
    case 'opBlocked': S.dialog = { type: 'opBlocked', op: el.dataset.op }; ro.focusDialog = true; break;
    case 'opOk': S.pmenu = null; toast(`（モック）${esc(el.dataset.op)}`); break;
    case 'surfTab': S.surf.tab = el.dataset.tab; ro.focus = `[data-tab="${S.surf.tab}"]`; break;
    case 'scen': {
      const k = el.dataset.key, v = el.dataset.val;
      if (k === 'domain') { setEntry(D0, v || null); S.hl = null; S.direct.revealed = false; S.profReveal = false; }
      if (k === 'src') { S.direct.src = v; S.direct.revealed = false; }
      if (k === 'cw') { S.direct.cw = v === '1'; S.direct.cwOpen = false; }
      if (k === 'debug') S.surf.debug = v === '1';
      break;
    }
  }
  render(ro);
});
document.addEventListener('toggle', ev => { if (ev.target.matches && ev.target.matches('.impact details') && S.dialog) S.dialog.open = ev.target.open; }, true);
document.addEventListener('input', ev => { if (ev.target.id === 'addInput') S.dialog.value = ev.target.value; });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if (S.dialog) { S.dialog = null; render(); return; }
    if (S.pmenu) { S.pmenu = null; render(); return; }
    if (S.chipMenu) { S.chipMenu = false; render({ focus: '#profileChip' }); return; }
  }
  if (ev.key === 'Enter' && ev.target.id === 'addInput') { ev.preventDefault(); document.querySelector('[data-act="addSubmit"][data-kind="mute"]').click(); }
  const trapIn = S.dialog ? '.dialog' : S.pmenu ? '.pmenu' : null;
  if (ev.key === 'Tab' && trapIn) {
    const box = document.querySelector(trapIn);
    const f = [...box.querySelectorAll('summary, input, button:not([disabled])')];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!box.contains(document.activeElement)) { ev.preventDefault(); first.focus(); return; }
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
  if (S.pmenu && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
    const items = [...document.querySelectorAll('.pmenu button')]; const i = items.indexOf(document.activeElement);
    const n = (i + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items[n].focus(); ev.preventDefault();
  }
});

function renderDoc() {
  document.querySelector('.mockbar').remove();
  const groups = [['1', '① 設定の一覧・追加と主導線'], ['2', '② ブロック／解除の確認'], ['3', '③ 直接 URL・プロフィールで開いたとき'], ['4', '④ ブロック中の相手への操作'], ['5', '⑤ タイムライン・通知・検索']];
  document.getElementById('root').innerHTML = `<div class="doc">
    <h1>D08 ドメインのミュート・ブロック — 採用した UI 仕様</h1>
    <p>ユーザーフィードバックで決まった内容。番号は旧モックの論点番号と対応する。</p>
    ${groups.map(([g, t]) => `<h2>${t}</h2><ul class="spec">${Object.entries(SPEC).filter(([n]) => n.startsWith(g + '-')).map(([n, s]) => `<li><span class="spec-no">${n}</span><span>${esc(s)}</span></li>`).join('')}</ul>`).join('')}
    <h2>Misskey / X から学んだ「引き算」</h2>
    <ul class="spec">${LESSONS.map((s, i) => `<li><span class="spec-no">${i + 1}</span><span>${esc(s)}</span></li>`).join('')}</ul>
  </div>`;
}
if (MODE === 'doc') renderDoc(); else render();
</script>
