<title>shuttlepub-web UI モック — 基本レイアウト ＋ D03 クイックリアクション</title>
<style>
/* ===== packages/design-tokens/tokens.css（そのまま転記） ===== */
:root, [data-color="catppuccin-mocha"] {
  --theme-bg-primary: #1e1e2e; --theme-bg-secondary: #181825; --theme-bg-surface: #313244;

  --theme-text-muted: #6c7086; --theme-text-heading: #cdd6f4; --theme-accent: #cba6f7;
  --theme-accent-hover: #b4befe; --theme-border: #45475a; --theme-temp-high: #f38ba8;
  --theme-temp-low: #89b4fa; --theme-error: #f38ba8;
}
[data-color="tokyo-night"] {
  --theme-bg-primary: #1a1b26; --theme-bg-secondary: #16161e; --theme-bg-surface: #24283b;
  --theme-bg-nav: rgba(26, 27, 38, 0.9); --theme-text-primary: #a9b1d6; --theme-text-secondary: #787c99;
  --theme-text-muted: #565f89; --theme-text-heading: #c0caf5; --theme-accent: #7aa2f7;
  --theme-accent-hover: #89ddff; --theme-border: #3b4261; --theme-temp-high: #f7768e;
  --theme-temp-low: #7dcfff; --theme-error: #f7768e;
}
:root, [data-shape="rounded"] { --theme-radius: 0.75rem; --theme-radius-lg: 1rem; --theme-shadow: 0 2px 8px rgba(0,0,0,.15); }
[data-shape="sharp"] { --theme-radius: 0px; --theme-radius-lg: 0px; --theme-shadow: none; }
/* packages/styles: active setting highlight */
[data-color="catppuccin-mocha"] [data-color-option="catppuccin-mocha"],
[data-color="tokyo-night"] [data-color-option="tokyo-night"],
[data-shape="rounded"] [data-shape-option="rounded"],
[data-shape="sharp"] [data-shape-option="sharp"] { outline: 2px solid var(--theme-accent); outline-offset: -2px; }

/* ===== Tailwind preflight 相当 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
html { font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { background: var(--theme-bg-secondary); color: var(--theme-text-primary); font-size: 14px; min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; background: transparent; }

:focus-visible { outline: 2px solid var(--theme-accent); outline-offset: 2px; }

/* ===== モック外枠（議論用ツールバー・注記） ===== */
.mock-top { position: sticky; top: 0; z-index: 100; background: var(--theme-bg-nav); backdrop-filter: blur(12px); border-bottom: 1px solid var(--theme-border); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
@media (max-width: 1400px) { .mock-top { position: static; } }
.mock-title { font-weight: 750; letter-spacing: -.3px; color: var(--theme-text-heading); margin-right: 8px; }
.mock-title small { display: block; font-weight: 400; font-size: 11px; color: var(--theme-text-muted); letter-spacing: 0; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--theme-border); border-radius: var(--theme-radius); flex-wrap: wrap; }
.seg button { padding: 5px 10px; font-size: 12px; border-radius: calc(var(--theme-radius) * .6); color: var(--theme-text-secondary); white-space: nowrap; }
.seg button:hover { background: color-mix(in srgb, currentColor 7%, transparent); }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--theme-accent) 16%, transparent); color: var(--theme-accent); font-weight: 650; }
.seg.sm button { padding: 3px 8px; font-size: 11px; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--theme-text-muted); }
.mock-reset { font-size: 11px; padding: 6px 10px; border: 1px solid var(--theme-border); border-radius: var(--theme-radius); color: var(--theme-text-secondary); }
.hint-strip { margin: 16px 24px 0; padding: 10px 14px; font-size: 12px; color: var(--theme-text-secondary); border: 1px dashed var(--theme-border); border-radius: var(--theme-radius); line-height: 1.8; }
.hint-strip b { color: var(--theme-accent); font-weight: 650; }
.stage { display: flex; flex-wrap: wrap; gap: 24px; padding: 20px 24px 60px; align-items: flex-start; }
.frames { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.dev-cap { font-size: 11px; color: var(--theme-text-muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.dev-cap .badge { font-weight: 700; color: var(--theme-bg-primary); background: var(--theme-text-secondary); padding: 1px 7px; border-radius: 999px; }
.notes { flex: 1 1 340px; min-width: 320px; max-width: 760px; }
.notes-h { font-size: 16px; font-weight: 650; color: var(--theme-text-heading); margin-bottom: 4px; }
.notes-sub { font-size: 11px; color: var(--theme-text-muted); margin-bottom: 14px; }
.note-group { margin-bottom: 18px; }
.note-group > h3 { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--theme-text-muted); margin: 0 0 8px; text-transform: uppercase; }
.note { border: 1px solid var(--theme-border); border-radius: var(--theme-radius); padding: 12px 14px; background: var(--theme-bg-primary); margin-bottom: 10px; transition: border-color .15s; }
.note:hover { border-color: var(--theme-temp-high); }
.note-h { display: flex; gap: 8px; align-items: baseline; }
.nid { font-size: 10px; font-weight: 800; color: var(--theme-bg-primary); background: var(--theme-temp-high); border-radius: 4px; padding: 0 5px; flex-shrink: 0; }
.note h4 { font-size: 13px; font-weight: 650; color: var(--theme-text-heading); }
.note ul { margin: 8px 0 0; font-size: 12px; color: var(--theme-text-secondary); display: grid; gap: 3px; }
.note li { padding-left: 1.4em; text-indent: -1.4em; line-height: 1.6; }
.note .rec { margin-top: 8px; font-size: 12px; line-height: 1.6; color: var(--theme-text-primary); background: color-mix(in srgb, var(--theme-accent) 9%, transparent); border-radius: calc(var(--theme-radius) * .6); padding: 6px 9px; }
.note .rec b { color: var(--theme-accent); margin-right: 6px; }
.note .rev { margin-top: 6px; font-size: 11px; color: var(--theme-temp-high); }
.note .variant { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--theme-text-muted); flex-wrap: wrap; }
.hl-on { outline: 2px dashed var(--theme-temp-high) !important; outline-offset: 3px; }
.issues-page { padding: 24px; max-width: 1400px; columns: 2 520px; column-gap: 24px; }
.issues-page .note-group { break-inside: avoid-column; }
.catalog { padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 28px; align-items: start; }
.cat-item > .cap { font-size: 12px; font-weight: 650; color: var(--theme-text-heading); margin-bottom: 4px; }
.cat-item > .cap small { display: block; font-weight: 400; color: var(--theme-text-muted); font-size: 11px; }

/* ===== 端末フレーム ===== */
.device { --line: color-mix(in srgb, currentColor 13%, transparent); background: var(--theme-bg-primary); color: var(--theme-text-primary); border: 1px solid var(--theme-border); border-radius: 16px; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 16px 56px #0005; }
.device.desk { width: 1000px; height: 760px; }
.device.mob { width: 390px; height: 800px; border-radius: 30px; }
.device.cat { height: auto; }
.device.cat.mob { height: 720px; }

/* ===== アプリ本体（booskiff-web の app shell に準拠） ===== */
.app { display: flex; flex-direction: column; height: 100%; position: relative; font-size: 14px; min-height: 0; }
.app :focus-visible { outline: 2px solid var(--theme-accent); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: 0 0 auto; }
.app-header { height: 64px; flex-shrink: 0; padding: 0 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--theme-bg-nav); position: relative; z-index: 5; }
.is-mob .app-header { height: 56px; padding: 0 12px; }
.app-brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 750; letter-spacing: -.6px; color: var(--theme-text-heading); }
.is-mob .app-brand { font-size: 16px; gap: 8px; }
.brand-symbol { width: 32px; height: 32px; border-radius: calc(var(--theme-radius) * .9); background: color-mix(in srgb, var(--theme-accent) 18%, transparent); color: var(--theme-accent); display: grid; place-items: center; }

.header-right { display: flex; align-items: center; gap: 8px; }

.pb-name { display: block; font-size: 12px; font-weight: 650; line-height: 1.25; color: var(--theme-text-heading); }
.pb-handle { display: block; font-size: 11px; color: var(--theme-text-muted); line-height: 1.25; }
.profile-btn .ic { width: 16px; height: 16px; opacity: .6; }
.mob-avatar-btn { padding: 4px; border-radius: var(--theme-radius); display: flex; align-items: center; gap: 2px; }
.mob-avatar-btn .ic { width: 14px; height: 14px; opacity: .6; }
.avatar { width: 44px; height: 44px; border-radius: var(--theme-radius); display: grid; place-items: center; font-weight: 750; color: #1e1e2e; font-size: 17px; flex-shrink: 0; }
.avatar.sm { width: 30px; height: 30px; font-size: 13px; border-radius: calc(var(--theme-radius) * .7); }
.avatar.xs { width: 22px; height: 22px; font-size: 10px; border-radius: calc(var(--theme-radius) * .5); }
.app-body { flex: 1; display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 0; }
.is-mob .app-body { display: flex; }
.sidebar { border-right: 1px solid var(--line); padding: 24px 14px; display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .14em; opacity: .45; margin: 0 0 10px; }
.sidebar .eyebrow { padding-left: 14px; }
.side-link { display: flex; align-items: center; gap: 11px; padding: 11px 14px; border-radius: var(--theme-radius); font-weight: 600; color: var(--theme-text-secondary); }
.side-link:hover { background: color-mix(in srgb, currentColor 6%, transparent); }
.side-link.selected { background: color-mix(in srgb, var(--theme-accent) 10%, transparent); color: var(--theme-accent); }
.sidebar .btn { margin-top: 14px; }
.scroll { overflow-y: auto; flex: 1; min-width: 0; position: relative; }
.content { max-width: 640px; margin: 0 auto; padding: 28px 28px 140px; }
.is-mob .content { padding: 0 0 110px; }
.page-heading { margin-bottom: 18px; }
.page-heading .eyebrow { margin-bottom: 6px; }
.h1 { font-size: 28px; letter-spacing: -.7px; font-weight: 650; color: var(--theme-text-heading); }
.is-mob .h1 { font-size: 22px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: calc(var(--theme-radius) * .75); padding: 9px 16px; font-size: 12px; font-weight: 650; min-height: 38px; border: 1px solid transparent; white-space: nowrap; }
.btn.primary { background: var(--theme-accent); color: var(--theme-bg-primary); }
.btn.primary:hover { background: var(--theme-accent-hover); }
.btn.secondary { border-color: var(--line); background: color-mix(in srgb, currentColor 3%, transparent); }
.btn.secondary:hover:not(:disabled) { border-color: var(--theme-accent); }
.btn:disabled { opacity: .45; }
.btn .ic { width: 16px; height: 16px; }
.is-mob .btn { min-height: 44px; }
.muted { color: var(--theme-text-muted); }

/* TL tabs / composer */
.tl-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.is-mob .tl-tabs { margin-bottom: 0; position: sticky; top: 0; z-index: 4; background: var(--theme-bg-nav); backdrop-filter: blur(8px); }
.tl-tab { padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--theme-text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.is-mob .tl-tab { flex: 1; padding: 12px 0; }
.tl-tab[aria-selected="true"] { color: var(--theme-accent); border-color: var(--theme-accent); }
.composer { border: 1px solid var(--theme-border); background: var(--theme-bg-surface); border-radius: var(--theme-radius-lg); box-shadow: var(--theme-shadow); padding: 14px 16px; margin-bottom: 18px; }
.composer-author { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--theme-text-secondary); }
.composer-author b { color: var(--theme-text-heading); font-weight: 650; }
.composer textarea { width: 100%; resize: none; margin-top: 10px; font-size: 14px; outline: none; color: var(--theme-text-primary); }

.vis { font-size: 12px; color: var(--theme-text-muted); display: inline-flex; align-items: center; gap: 4px; }

/* 投稿カード */
.tl { border: 1px solid var(--line); border-radius: var(--theme-radius-lg); }
.is-mob .tl { border-left: 0; border-right: 0; border-top: 0; border-radius: 0; }
.post { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.post:last-child { border-bottom: 0; }
.is-mob .post { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 14px 14px 6px; }
.is-mob .post .avatar { width: 40px; height: 40px; font-size: 15px; }
.post-ctx { grid-column: 1 / -1; font-size: 11px; color: var(--theme-text-muted); display: flex; gap: 6px; align-items: center; padding-left: 26px; margin-bottom: -6px; }
.post-ctx .ic { width: 14px; height: 14px; }
.post-head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.post-name { font-weight: 650; color: var(--theme-text-heading); white-space: nowrap; }
.post-handle { color: var(--theme-text-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.post-time { margin-left: auto; color: var(--theme-text-muted); font-size: 12px; white-space: nowrap; }

.post-text { margin-top: 3px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; cursor: pointer; }
.post.big .post-text { font-size: 17px; cursor: auto; margin-top: 10px; }
.post.big { grid-template-columns: 52px minmax(0, 1fr); }
.post.big .avatar { width: 52px; height: 52px; }
.post-media { margin-top: 10px; height: 168px; border-radius: var(--theme-radius); border: 1px solid var(--line); background: radial-gradient(circle at 25% 35%, #f5c2e7 0 18%, transparent 19%), radial-gradient(circle at 70% 60%, #89b4fa 0 22%, transparent 23%), linear-gradient(135deg, #45475a, #313244); display: flex; align-items: flex-end; padding: 8px 10px; font-size: 11px; color: #cdd6f4; }
.post-meta { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--theme-text-muted); display: flex; gap: 14px; flex-wrap: wrap; }

/* 絵文字 */
.emo { display: inline-grid; place-items: center; width: 1.2em; height: 1.2em; font-size: 16px; line-height: 1; font-style: normal; }
.emo svg { width: 100%; height: 100%; display: block; }

/* リアクション集計チップ */
.reactions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.rchip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border-radius: calc(var(--theme-radius) * .75); border: 1px solid var(--line); background: color-mix(in srgb, currentColor 4%, transparent); font-size: 12px; color: var(--theme-text-secondary); font-variant-numeric: tabular-nums; }

.rchip.mine { border-color: var(--theme-accent); background: color-mix(in srgb, var(--theme-accent) 14%, transparent); color: var(--theme-accent); font-weight: 650; }
.rchip.more { color: var(--theme-text-muted); }
.rchip .x { font-size: 13px; margin-left: 1px; opacity: .8; }
.is-mob .rchip { height: 32px; }

/* アクション行 */
.actions { display: flex; align-items: center; gap: 2px; margin-top: 6px; margin-left: -8px; }
.act-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; min-width: 34px; padding: 0 8px; border-radius: calc(var(--theme-radius) * .75); font-size: 12px; color: var(--theme-text-muted); border: 1px solid transparent; }
.act-btn:hover { background: color-mix(in srgb, currentColor 7%, transparent); color: var(--theme-text-primary); }

.act-btn .ic { width: 18px; height: 18px; }
.act-btn.more-btn { margin-left: auto; }
.is-mob .act-btn { height: 44px; min-width: 44px; }
.react-slot { position: relative; display: inline-flex; }
.my-react { background: color-mix(in srgb, var(--theme-accent) 18%, transparent); border-color: var(--theme-accent); color: var(--theme-accent); padding: 0 10px; }
.my-react:hover { background: color-mix(in srgb, var(--theme-accent) 26%, transparent); color: var(--theme-accent); }
.my-react .emo { font-size: 19px; }
.my-react .x { font-size: 15px; font-weight: 700; line-height: 1; opacity: .85; }
.my-react .lbl { font-size: 11px; font-weight: 650; }

/* ===== リアクションピッカー ===== */
.picker { width: 352px; background: var(--theme-bg-primary); border: 1px solid var(--theme-border); border-radius: var(--theme-radius-lg); box-shadow: 0 16px 48px #0008; padding: 12px; z-index: 30; text-align: left; }
.picker.pop { position: absolute; top: calc(100% + 6px); left: -40px; }
.picker.inline { position: static; margin-top: 14px; box-shadow: none; width: 100%; max-width: 420px; }
.pk-top { display: flex; align-items: center; justify-content: space-between; margin: -2px -4px 8px 2px; }
.pk-title { font-size: 12px; font-weight: 650; color: var(--theme-text-heading); }
.pk-top .icon-btn { width: 28px; height: 28px; }

.pk-search { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: calc(var(--theme-radius) * .75); background: color-mix(in srgb, currentColor 3%, transparent); }

.is-mob .pk-search { padding: 10px 12px; }
.fav-block { margin-top: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }

.fav-row { display: flex; gap: 6px; }
.fav { width: 56px; height: 48px; display: grid; place-items: center; border-radius: calc(var(--theme-radius) * .75); background: color-mix(in srgb, currentColor 5%, transparent); border: 1px solid var(--line); position: relative; }
.fav .emo { font-size: 25px; }
.fav:hover { border-color: var(--theme-accent); background: color-mix(in srgb, var(--theme-accent) 10%, transparent); }
.fav.unavail { cursor: not-allowed; background: transparent; border-style: dashed; }
.fav.unavail:hover { border-color: var(--line); background: transparent; }
.fav.unavail .emo { filter: grayscale(1); opacity: .3; }
.fav.unavail::after { content: ""; position: absolute; width: 58%; height: 2px; border-radius: 2px; background: var(--theme-text-muted); transform: rotate(-35deg); }
.is-mob .fav { flex: 1; height: 54px; width: auto; }
.pk-tabs { display: flex; gap: 2px; margin-top: 10px; }
.pk-tab { flex: 1; height: 34px; border-radius: calc(var(--theme-radius) * .6); display: grid; place-items: center; font-size: 17px; opacity: .55; }
.pk-tab:hover { opacity: .9; background: color-mix(in srgb, currentColor 6%, transparent); }
.pk-tab[aria-selected="true"] { opacity: 1; background: color-mix(in srgb, var(--theme-accent) 13%, transparent); box-shadow: inset 0 -2px 0 var(--theme-accent); }
.pk-tab .emo { font-size: 17px; }
.is-mob .pk-tab { height: 42px; }
.pk-cat { font-size: 11px; font-weight: 650; color: var(--theme-text-muted); margin: 10px 2px 4px; }
.pk-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; max-height: 172px; overflow-y: auto; }
.is-mob .pk-grid { grid-template-columns: repeat(7, 1fr); max-height: 250px; }
.pk-emo { aspect-ratio: 1; display: grid; place-items: center; border-radius: calc(var(--theme-radius) * .6); }

function hashIdx(s) { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; }
function aggregate(p, f) {
  const m = {};
  let off = hashIdx(p.id);
  for (const [k, c] of Object.entries(p.base)) {
    const names = []; for (let i = 0; i < c; i++) names.push(POOL[(off + i) % POOL.length]);
    off += c + 2;
    m[k] = { key: k, count: c, names: names.map(n => ({ ...person(n) })) };
  }
  for (const pr of S.profiles) {
    const k = S.my[pr.id][p.id]; if (!k) continue;
    m[k] = m[k] || { key: k, count: 0, names: [] };
    m[k].count++; m[k].names.unshift({ name: pr.name, handle: pr.handle + '@shuttlepub.example', color: pr.color, ini: pr.ini, you: f && pr.id === f.pid, own: true });
  }
  const list = Object.values(m).sort((a, b) => b.count - a.count);
  const mineK = f && S.my[f.pid] && S.my[f.pid][p.id];
  const i = mineK ? list.findIndex(x => x.key === mineK) : -1;
  if (i > 0) list.unshift(...list.splice(i, 1));
  return list;
}

function aggHTML(f, p) {
  const list = aggregate(p, f);
  if (!list.length) return '';
  const mine = myR(f, p.id), MAX = 8;
  const chips = list.slice(0, MAX).map(({ key, count, names }) => {
    const isMine = key === mine;
    const tip = names.slice(0, 3).map(n => n.you ? 'あなた' : n.name).join('、') + (names.length > 3 ? ` ほか ${names.length - 3} 人` : '');
    let mode = 'static';
    if (isMine && (S.opts.selStyle === 'C' || S.opts.chipReact === 'on')) mode = 'unreact';
    else if (!mine && S.opts.chipReact === 'on' && isAvail(key)) mode = 'react';
    const cls = `rchip ${isMine ? 'mine' : ''}`;
    const inner = `${emo(key)}<span>${count}</span>`;
    if (mode === 'static') return `<span class="${cls}" title="${esc(tip)}" aria-label="${esc(emoLabel(key))} ${count}：${esc(tip)}">${inner}</span>`;
    const label = mode === 'unreact' ? `${emoLabel(key)} を取り消す` : `${emoLabel(key)} でリアクション（${count}：${tip}）`;
    const fk = isMine && S.opts.selStyle === 'C' ? `data-fk="react-${p.id}"` : '';
    return `<button class="${cls}" data-act="${mode === 'unreact' ? 'unreact' : 'reactWith'}" data-post="${p.id}" data-key="${key}" title="${esc(tip)}" aria-label="${esc(label)}" ${isMine ? 'aria-pressed="true"' : ''} ${fk}>${inner}</button>`;
  });
  if (list.length > MAX) chips.push(`<a href="#" class="rchip more" data-act="nav" data-route="detail" data-post="${p.id}" aria-label="ほか ${list.length - MAX} 種類">+${list.length - MAX}</a>`);
  return `<div class="reactions" data-hl="agg">${chips.join('')}</div>`;
}

function pickerBody(f, mob) {
  const pk = f.picker, pr = prof(f), favs = pr.favorites, q = pk.q.trim().toLowerCase();
  const showFav = pk.mode === 'react' && favs.length > 0 && !(q && S.opts.hideFavOnSearch === 'on');
  let h = `<label class="pk-search">${icon('search')}<input type="search" data-fk="pk-search" data-input="pickerSearch" value="${esc(pk.q)}" placeholder="検索" aria-label="絵文字を検索"></label>`;
  if (showFav) {
    h += `<div class="fav-block" data-hl="fav-row"><div class="fav-row" role="group" aria-label="常用絵文字">${favs.map((k, i) => isAvail(k)
        ? `<button class="fav" data-act="pick" data-key="${k}" data-fk="fav-pick-${i}" aria-label="${esc(emoLabel(k))}" title="${esc(emoLabel(k))}">${emo(k)}</button>`
        : `<button class="fav unavail" data-act="favUnavail" data-key="${k}" aria-disabled="true" aria-label="${esc(emoLabel(k))}（利用不可）" title="利用不可" data-hl="fav-unavail">${emo(k)}</button>`).join('')}
      <button class="fav-cfg" data-act="nav" data-route="settings" aria-label="常用絵文字を設定" title="設定" data-hl="fav-edit">${icon('settings')}</button></div></div>`;
  }
  const taken = k => pk.mode !== 'react' && favs.includes(k);
  const cell = k => `<button class="pk-emo" data-act="pick" data-key="${k}" ${taken(k) ? 'disabled' : ''} aria-label="${esc(emoLabel(k))}" title="${esc(emoLabel(k))}">${emo(k)}</button>`;
  if (!q) {
    h += `<div class="pk-tabs" role="tablist" aria-label="カテゴリ">${CATS.map(([id, k, label]) => `<button class="pk-tab" role="tab" aria-selected="${pk.cat === id}" data-act="pkCat" data-cat="${id}" aria-label="${label}" title="${label}">${emo(k)}</button>`).join('')}</div>`;
    h += `<div class="pk-grid">${ALL_KEYS(pk.cat).map(cell).join('')}</div>`;
  } else {
    const keys = [...CATS.flatMap(c => ALL_KEYS(c[0]))].filter(k => (k.startsWith('u:') ? UNI_NAME[k.slice(2)] : k.slice(2) + ' ' + CUSTOM[k.slice(2)].name).toLowerCase().includes(q) || k.slice(2) === pk.q.trim());
    h += keys.length ? `<div class="pk-grid">${keys.map(cell).join('')}</div>` : `<p class="pk-empty">見つかりません</p>`;
  }
  if (pk.mode === 'react' && favs.length === 0 && S.opts.emptyHint === 'on') {
    h += `<div class="pk-foot" data-hl="pk-foot"><a href="#" data-act="nav" data-route="settings">${icon('settings')}常用絵文字</a></div>`;
  }
  return h;
}
function pickerHTML(f, mob) {

  if (f.picker.mode !== 'react') return `<div class="modal-backdrop"><div class="picker modal" role="dialog" aria-modal="true" aria-label="絵文字">${pickerBody(f, mob)}</div></div>`;
  return `<div class="picker pop" role="dialog" aria-label="絵文字" data-hl="picker">${pickerBody(f, mob)}</div>`;

function noteHTML(n) {

document.addEventListener('mouseover', e => {
  const n = e.target.closest('[data-note-hl]');
  const key = n ? n.dataset.noteHl : null;
  if (key === document.body.dataset.hlKey) return;
  document.body.dataset.hlKey = key || '';
  document.querySelectorAll('.hl-on').forEach(x => x.classList.remove('hl-on'));
  if (key) document.querySelectorAll(`#pane-mock .device [data-hl~="${key}"]`).forEach(x => x.classList.add('hl-on'));
});

  };
  card('1. 未反応', s => { s.my.p1 = {}; }, {}, 'n1');

/* URL ハッシュで初期状態を指定（例: #view=desk&route=settings&pid=p2&picker=n1&q=ねこ&sel=A&menu=1） */
(function applyHash() {
  const h = new URLSearchParams(decodeURIComponent(location.hash.slice(1)));
  if (!location.hash) return;
  if (h.get('tab')) UI.tab = h.get('tab');
  if (h.get('view')) UI.view = h.get('view');
  if (h.get('sel')) S.opts.selStyle = h.get('sel');
  if (h.get('hint')) S.opts.emptyHint = h.get('hint');
  for (const f of Object.values(F)) {
    if (h.get('route')) f.route = h.get('route');
    if (h.get('post')) f.postId = h.get('post');
    if (h.get('dtab')) f.detailTab = h.get('dtab');
    if (h.get('rsel')) f.reactTab = h.get('rsel');
    if (f.route === 'detail' && !f.postId) f.postId = 'n2';
    if (h.get('pid')) f.pid = h.get('pid');
    if (h.get('picker')) f.picker = { mode: 'react', postId: h.get('picker'), q: h.get('q') || '', cat: h.get('cat') || 'face' };
    if (h.get('fav')) f.picker = { mode: h.get('fav') === 'add' ? 'fav-add' : 'fav-replace', slot: +(h.get('slot') || 0), q: h.get('q') || '', cat: h.get('cat') || 'face' };
    if (h.get('menu')) f.menu = true;
    if (h.get('compose')) { f.compose = true; f.draft = h.get('draft') || ''; f.visMenu = h.get('vis') === 'menu'; }
    if (h.get('fmenu')) f.favMenu = +h.get('fmenu');
    if (h.get('color')) f.color = h.get('color');
    if (h.get('shape')) f.shape = h.get('shape');
  }
  if (h.get('unreact')) for (const pid of Object.keys(S.my)) S.my[pid] = {};
  if (h.get('toast') === 'undo') for (const f of Object.values(F)) f.toast = { html: `${emo('u:👍')} 取り消しました`, undo: { post: 'n1', key: 'u:👍' }, id: -1 };
})();
renderAll();
